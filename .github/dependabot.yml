version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /analytics/dashboards/hr-analytics-full-set/production-pipeline
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
