name: Temporary HR generated-output refresh

on:
  push:
    branches: [feat/hr-public-dashboard-polish]

permissions:
  contents: write

jobs:
  refresh-generated-html:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '22' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.11' }
      - name: Install locked HR pipeline dependencies
        run: python -m pip install --disable-pip-version-check -r analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Rebuild canonical public HR dashboards
        run: bash scripts/regenerate-hr-dashboards.sh
      - name: Commit canonical generated HTML only
        run: |
          set -euo pipefail
          git add -- ':(glob)frontend/analytics/dashboards/hr-analytics-full-set/**/*.html'
          if git diff --cached --quiet; then
            echo 'Generated HR public HTML is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: refresh generated HR public dashboards'
          git push origin HEAD:feat/hr-public-dashboard-polish
