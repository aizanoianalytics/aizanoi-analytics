name: Ancient World AAA PR one-shot runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/ancient-world-aaa-final-2026-08-18' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ancient-world-aaa-final-2026-08-18
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run registered patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/aaa-athens-framing-one-shot.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'aaa-athens-framing-patch.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          node --check frontend/ancient-world/engine/landmark-framing.js
          node --check frontend/ancient-cities/athens-450-430/data/city.js
          node --check frontend/ancient-cities/athens-450-430/data/manifest.js
          node --test tests/*.test.mjs

      - name: Commit patch and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aizanoi-aaa-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/aaa-pr-runner.yml .github/workflows/aaa-athens-framing-one-shot.yml
          git rm -f .github/aaa-one-shot-trigger.txt || true
          git add frontend tests
          git commit -m "fix: align Athens chronology and landmark framing"
          git push origin HEAD:feat/ancient-world-aaa-final-2026-08-18
