name: Temporary Three.js Color Managed Palette

on:
  push:
    branches:
      - exp/threejs-rome-renderer-poc

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: exp/threejs-rome-renderer-poc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded color-managed palette patch
        run: python scripts/patch_threejs_color_managed_palette.py
      - name: Validate syntax
        run: |
          node --check experiments/threejs-rome-renderer/src/main.js
          node --check experiments/threejs-rome-renderer/src/visual-palette.js
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No patch changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/threejs-rome-renderer/src/main.js
          git commit -m 'fix: color-manage Three.js Rome terrain palette'
          git push
