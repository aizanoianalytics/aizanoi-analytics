name: Render Social Preview PNG

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: render-social-preview-png
  cancel-in-progress: true

jobs:
  render:
    if: github.head_ref == 'feat/final-polish-aaa-2026-08-18'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-polish-aaa-2026-08-18
          fetch-depth: 0

      - name: Render 1200x630 PNG from reviewed SVG source
        run: |
          google-chrome --headless --no-sandbox --hide-scrollbars \
            --window-size=1200,630 \
            --screenshot=frontend/assets/branding/aizanoi-og.png \
            "file://$PWD/frontend/assets/branding/aizanoi-og.svg"
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('frontend/assets/branding/aizanoi-og.png')
          data=p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'invalid PNG signature'
          width,height=struct.unpack('>II',data[16:24])
          assert (width,height)==(1200,630), (width,height)
          assert len(data) > 10_000, len(data)
          for name in ['frontend/index.html','frontend/historic-world/index.html']:
              path=Path(name)
              text=path.read_text()
              text=text.replace('aizanoi-og.svg','aizanoi-og.png')
              path.write_text(text)
          test=Path('tests/final-polish.test.mjs')
          text=test.read_text()
          if "aizanoi-og\\.png" not in text:
              text=text.replace("assert.match(index,/twitter:card/);", "assert.match(index,/twitter:card/);\n  assert.match(index,/aizanoi-og\\.png/);")
              test.write_text(text)
          print(f'PNG validated: {width}x{height}, {len(data)} bytes')
          PY

      - name: Commit raster asset and retire one-shot workflow
        run: |
          rm -f .github/workflows/render-social-png.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend tests .github/workflows
          git diff --cached --check
          git commit -m "feat: publish raster social sharing preview"
          git fetch origin feat/final-polish-aaa-2026-08-18
          git rebase origin/feat/final-polish-aaa-2026-08-18
          git push origin HEAD:feat/final-polish-aaa-2026-08-18
