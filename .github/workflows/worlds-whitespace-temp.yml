name: Temporary Worlds Whitespace Cleanup

on:
  push:
    branches: [refactor/unified-worlds-threejs]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Normalize authored Worlds whitespace
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('frontend/worlds')
          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in {'.html', '.css', '.js'}:
                  continue
              if 'vendor' in path.parts:
                  continue
              original = path.read_text()
              lines = [line.rstrip(' \t') for line in original.splitlines()]
              cleaned = '\n'.join(lines).rstrip('\n') + '\n'
              if cleaned != original:
                  path.write_text(cleaned)
                  changed.append(str(path))
          print(f'normalized {len(changed)} authored file(s)')
          for path in changed:
              print(path)
          PY
          git diff --check
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/worlds
          if git diff --cached --quiet; then
            echo 'No authored whitespace changes required.'
            exit 0
          fi
          git commit -m 'style(worlds): normalize authored source whitespace'
          git push origin HEAD:refactor/unified-worlds-threejs
