name: Temporary shell startup apply

on:
  push:
    branches: [perf/shell-startup-yield]

permissions:
  contents: write

jobs:
  apply-shell-yield:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply validated shell startup yield
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('frontend/js/v3/shell.js')
          text=path.read_text()
          old="""  root.innerHTML=shellTemplate();\n  renderHome();\n  renderShelf();\n  renderClock();"""
          new="""  root.innerHTML=shellTemplate();\n  renderShelf();\n  renderClock();\n  requestAnimationFrame(()=>renderHome());"""
          if old not in text:
              raise SystemExit('mountShell render block changed; refusing apply')
          text=text.replace(old,new,1)
          old_restore="""  restoreWorkspace().catch((error)=>{\n    console.error('AizanoiOS workspace restoration failed.',error);\n    notify('Workspace restoration failed',error?.message||'Open an app to try again.');\n  });"""
          new_restore="""  requestAnimationFrame(()=>restoreWorkspace().catch((error)=>{\n    console.error('AizanoiOS workspace restoration failed.',error);\n    notify('Workspace restoration failed',error?.message||'Open an app to try again.');\n  }));"""
          if old_restore not in text:
              raise SystemExit('restoreWorkspace block changed; refusing apply')
          path.write_text(text.replace(old_restore,new_restore,1))
          PY
      - name: Commit shell change only
        run: |
          set -euo pipefail
          git add frontend/js/v3/shell.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: yield non-critical shell startup work'
          git push origin HEAD:perf/shell-startup-yield
