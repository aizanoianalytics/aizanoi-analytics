name: Temporary CodeQL SARIF Inspect
on:
  push:
    branches: [fix/hr-synthetic-historical-dates]
permissions:
  contents: read
  security-events: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 0163cc7f2c06e5aff5c57b10caa2fc17358d0c1f
          fetch-depth: 0
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: /language:javascript-typescript
          output: /tmp/codeql-results
          upload: never
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codeql-sarif-inspect
          path: /tmp/codeql-results
          retention-days: 1
