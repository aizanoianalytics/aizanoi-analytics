name: Aizanoi CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aizanoi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/eslint/package-lock.json
      - name: JavaScript syntax checks
        run: |
          set -euo pipefail
          mkdir -p artifacts/diagnostics
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find frontend/js/v3 frontend/ancient-world frontend/ancient-cities frontend/historic-world -type f -name '*.js' -print0)
          node --check frontend/release.js
          node --check frontend/analytics/catalog.js
          node --check frontend/analytics/app.js
          node --check frontend/service-worker.js
          node --check scripts/news/build-news.mjs
          node --check scripts/modules/build-module-registry.mjs
      - name: Enforce isolated bug-class ESLint gate
        run: |
          npm ci --prefix tools/eslint --ignore-scripts --no-fund
          npm audit --prefix tools/eslint --audit-level=high
          ./tools/eslint/node_modules/.bin/eslint -c eslint.config.js frontend/js/v3 frontend/analytics frontend/service-worker.js frontend/web-editor-preview/runner.js scripts tests
      - name: Validate module manifests and generated wiring
        run: node scripts/modules/build-module-registry.mjs --check
      - name: Build generated News surfaces
        run: node scripts/news/build-news.mjs
      - name: Regression tests
        run: |
          set -o pipefail
          node --test tests/*.test.mjs 2>&1 | tee artifacts/diagnostics/regression-tests.log
      - name: Audit contract tests
        run: |
          set -o pipefail
          node --test tests/audit/*.test.mjs 2>&1 | tee artifacts/diagnostics/audit-contract-tests.log
      - name: Reject whitespace errors
        if: success()
        run: git diff --check HEAD^ HEAD
      - name: Upload validate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: aizanoi-validate-diagnostics, path: 'artifacts/diagnostics/*', retention-days: 3 }

  hr-pipeline-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '22' }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Install locked HR pipeline dependencies
        run: python -m pip install --disable-pip-version-check -r analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Capture committed integrated-workbook baseline
        run: cp analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/icmal_sorgu_sonuc.xlsx /tmp/hr-integrated-baseline.xlsx
      - name: Rebuild HR Analytics Full Set from committed synthetic inputs
        run: |
          set -o pipefail
          mkdir -p artifacts/diagnostics
          bash scripts/regenerate-hr-dashboards.sh 2>&1 | tee artifacts/diagnostics/hr-pipeline-rebuild.log
      - name: Verify deterministic tracked outputs
        run: |
          set -euo pipefail
          python scripts/verify-hr-workbook-semantics.py /tmp/hr-integrated-baseline.xlsx analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/icmal_sorgu_sonuc.xlsx 2>&1 | tee artifacts/diagnostics/hr-workbook-semantics.log
          git diff --exit-code -- ':(glob)frontend/analytics/dashboards/hr-analytics-full-set/**/*.html'
          git diff --check
      - name: Upload HR rebuild diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: aizanoi-hr-pipeline-diagnostics, path: 'artifacts/diagnostics/*', retention-days: 3 }

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install pinned browser QA dependencies
        run: |
          mkdir -p artifacts/diagnostics
          cp package-lock.json artifacts/diagnostics/package-lock.json
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
          npx playwright install chromium
      - name: Build generated News surfaces
        run: node scripts/news/build-news.mjs
      - name: Start static frontend server
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/aizanoi-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/aizanoi-http.log; exit 1
      - name: Install production Nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
      - name: Production-like Nginx policy gate
        env: { AIZANOI_NGINX_BASE_URL: 'http://127.0.0.1:4174' }
        run: |
          set -o pipefail
          bash scripts/ci/with-production-nginx.sh 4174 node --test tests/browser/nginx-production-policy.test.mjs 2>&1 | tee artifacts/diagnostics/nginx-production-policy.log
      - name: Representative accessibility gate
        env: { AIZANOI_A11Y_REPORT: 'artifacts/diagnostics/representative-a11y.json' }
        run: |
          set -o pipefail
          bash scripts/ci/with-production-nginx.sh 4176 node tests/representative-a11y.mjs 2>&1 | tee artifacts/diagnostics/representative-a11y.log
      - name: Core browser gates
        env: { ANCIENT_WORLD_BASE_URL: 'http://127.0.0.1:4173' }
        run: |
          set -o pipefail
          status=0
          node tests/field-system-v3-browser-smoke.mjs 2>&1 | tee artifacts/diagnostics/field-system-v3-browser-smoke.log || status=1
          node tests/service-worker-browser.mjs 2>&1 | tee artifacts/diagnostics/service-worker-browser.log || status=1
          for script in ancient-city-browser-smoke.mjs historical-worlds-ui-browser-smoke.mjs historical-worlds-landmark-walk.mjs; do node "tests/$script" 2>&1 | tee "artifacts/diagnostics/$script.log" || status=1; done
          node tests/hr-analytics-browser-qa.mjs 2>&1 | tee artifacts/diagnostics/hr-analytics-browser-qa.log || status=1
          exit $status
      - name: AizanoiOS utility browser gates
        env: { ANCIENT_WORLD_BASE_URL: 'http://127.0.0.1:4173' }
        run: |
          set -o pipefail
          status=0
          node --test tests/browser/workspace-apps.test.mjs tests/browser/workspace-atomic.test.mjs tests/browser/web-editor-layout.test.mjs tests/browser/global-static-search.test.mjs 2>&1 | tee artifacts/diagnostics/workspace-browser.log || status=1
          node --test tests/browser/calculator-module.test.mjs 2>&1 | tee artifacts/diagnostics/calculator-browser.log || status=1
          node --test tests/browser/camera-module.test.mjs 2>&1 | tee artifacts/diagnostics/camera-browser.log || status=1
          node --test tests/browser/arcade-module.test.mjs tests/browser/arcade-legacy-lifecycle.test.mjs 2>&1 | tee artifacts/diagnostics/arcade-browser.log || status=1
          node --test tests/browser/mobile-home.test.mjs 2>&1 | tee artifacts/diagnostics/mobile-home.log || status=1
          exit $status
      - name: Capture final product visuals
        if: success()
        env: { ANCIENT_WORLD_BASE_URL: 'http://127.0.0.1:4173' }
        run: |
          set -o pipefail
          status=0
          node tests/historical-worlds-visual-capture.mjs 2>&1 | tee artifacts/diagnostics/historical-worlds-visual-capture.log || status=1
          node tests/field-system-v3-visual-capture.mjs 2>&1 | tee artifacts/diagnostics/field-system-v3-visual-capture.log || status=1
          exit $status
      - name: Upload visual regression review
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: aizanoi-final-visual-review, path: 'artifacts/final-visual-review/*.png', retention-days: 3 }
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: aizanoi-browser-diagnostics, path: 'artifacts/diagnostics/*', retention-days: 3 }

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned Lighthouse dependencies
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
      - name: Build generated News surfaces
        run: node scripts/news/build-news.mjs
      - name: Install production Nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
      - name: Enforce representative Lighthouse budgets
        env:
          AIZANOI_LIGHTHOUSE_DIR: 'artifacts/diagnostics/representative-lighthouse'
          AIZANOI_LIGHTHOUSE_ATTEMPTS: '3'
        run: |
          mkdir -p artifacts/diagnostics
          set -o pipefail
          bash scripts/ci/with-production-nginx.sh 4177 node tests/representative-lighthouse.mjs 2>&1 | tee artifacts/diagnostics/representative-lighthouse.log
      - name: Upload Lighthouse diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: aizanoi-lighthouse-diagnostics, path: 'artifacts/diagnostics/*', retention-days: 3 }
