name: Aizanoi CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aizanoi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/eslint/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: JavaScript syntax checks
        run: |
          set -euo pipefail
          mkdir -p artifacts/diagnostics
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find frontend/js/v3 frontend/worlds frontend/arcade -type f -name '*.js' -print0)
          node --check frontend/release.js
          node --check frontend/analytics/catalog.js
          node --check frontend/analytics/app.js
          node --check frontend/service-worker.js
          node --check scripts/news/build-news.mjs
          node --check scripts/modules/build-module-registry.mjs
      - name: Enforce isolated bug-class ESLint gate
        run: |
          npm ci --prefix tools/eslint --ignore-scripts --no-fund
          node scripts/ci/npm-audit-gate.mjs --prefix tools/eslint
          ./tools/eslint/node_modules/.bin/eslint -c eslint.config.js frontend/js/v3 frontend/analytics frontend/arcade frontend/worlds frontend/service-worker.js frontend/web-editor-preview/runner.js scripts tests
      - name: Validate module manifests and generated wiring
        run: node scripts/modules/build-module-registry.mjs --check
      - name: Build generated News surfaces
        run: node scripts/news/build-news.mjs
      - name: Regression tests
        run: |
          set -o pipefail
          node --test tests/*.test.mjs 2>&1 | tee artifacts/diagnostics/regression-tests.log
      - name: Audit contract tests
        run: |
          set -o pipefail
          node --test tests/audit/*.test.mjs 2>&1 | tee artifacts/diagnostics/audit-contract-tests.log
      - name: Python Markets and Aizanoi contract tests
        run: |
          set -o pipefail
          python -m unittest \
            tests.test_provider_contracts \
            tests.markets_pipeline_test \
            tests.markets_product_test \
            tests.test_markets_hardening \
            tests.test_markets_frontend_correctness \
            tests.validate_aizanoi_assets -v 2>&1 | tee artifacts/diagnostics/python-contract-tests.log
      - name: Reject whitespace errors
        if: success()
        run: git diff --check HEAD^ HEAD
      - name: Upload validate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: aizanoi-validate-diagnostics, path: 'artifacts/diagnostics/*', retention-days: 3 }

  # Isolate arena matches from the existing 12-minute WebGL/shell smoke.
  # Each game runs sequentially within its shard; games have separate runners.
  arcade-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arena: snake-royale
            suites: >-
              tests/browser/snake-royale.test.mjs
              tests/browser/snake-royale-accessibility.test.mjs
              tests/browser/snake-royale-custom-bot.test.mjs
              tests/browser/arcade-custom-bot.test.mjs
          - arena: chess
            suites: >-
              tests/browser/chess.test.mjs
              tests/browser/chess-review.test.mjs
          - arena: maze-chase
            suites: >-
              tests/browser/maze-chase.test.mjs
              tests/browser/maze-chase-regressions.test.mjs
              tests/browser/maze-chase-custom-bot.test.mjs
          - arena: capture-flag
            suites: >-
              tests/browser/capture-flag.test.mjs
              tests/browser/capture-flag-accessibility.test.mjs
              tests/browser/capture-flag-custom-bot.test.mjs
          - arena: holdem
            suites: >-
              tests/browser/holdem.test.mjs
              tests/browser/holdem-regressions.test.mjs
              tests/browser/holdem-custom-bot.test.mjs
          - arena: football
            suites: >-
              tests/browser/football.test.mjs
              tests/browser/football-custom-bot.test.mjs
          - arena: trade-arena
            suites: >-
              tests/browser/trade-arena.test.mjs
          - arena: anatolian-pact
            suites: >-
              tests/browser/anatolian-pact.test.mjs
              tests/browser/anatolian-pact-review.test.mjs
              tests/browser/anatolian-pact-custom-bot.test.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install pinned browser QA dependencies
        run: |
          mkdir -p artifacts/diagnostics
          npm ci --ignore-scripts --no-fund
          node scripts/ci/npm-audit-gate.mjs
          npx playwright install chromium
      - name: Start static frontend server
        run: |
          python3 -m http.server 4173 --directory frontend >"${RUNNER_TEMP}/arcade-http.log" 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/arcade/ >/dev/null && exit 0; sleep 0.5; done
          cat "${RUNNER_TEMP}/arcade-http.log"; exit 1
      - name: Arena interaction and regression suites
        env:
          ANCIENT_WORLD_BASE_URL: 'http://127.0.0.1:4173'
          ARCADE_BROWSER_SUITES: '${{ matrix.suites }}'
          ARCADE_ARENA: '${{ matrix.arena }}'
        run: |
          set -euo pipefail
          # Intentional splitting of the repository-authored suite list, not eval.
          read -r -a suites <<< "$ARCADE_BROWSER_SUITES"
          node --test --test-concurrency=1 "${suites[@]}" 2>&1 | tee "artifacts/diagnostics/arcade-${ARCADE_ARENA}.log"
      - name: Upload arcade diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aizanoi-arcade-${{ matrix.arena }}-diagnostics
          path: 'artifacts/diagnostics/*'
          retention-days: 3

  browser-smoke:
    # Preserve the required context while failing closed on every arena shard.
    needs: arcade-browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require successful arcade browser matrix
        env: { ARCADE_RESULT: '${{ needs.arcade-browser.result }}' }
        run: test "$ARCADE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install pinned browser QA dependencies
        run: |
          mkdir -p artifacts/diagnostics
          npm ci --ignore-scripts --no-fund
          node scripts/ci/npm-audit-gate.mjs
          npx playwright install chromium
      - name: Build generated News surfaces
        run: node scripts/news/build-news.mjs
      - name: Start static frontend server
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/aizanoi-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/aizanoi-http.log; exit 1
      - name: Install production Nginx
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -qq; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
          for attempt in 1 2 3; do
            if sudo apt-get install -y --no-install-recommends nginx; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
      - name: Production-like Nginx policy gate
        env: { AIZANOI_NGINX_BASE_URL: 'http://127.0.0.1:4174' }
        run: |
          set -o pipefail
          bash scripts/ci/with-production-nginx.sh 4174 node --test tests/browser/nginx-production-policy.test.mjs 2>&1 | tee artifacts/diagnostics/nginx-production-policy.log
      - name: Representative accessibility gate
        env: { AIZANOI_A11Y_REPORT: 'artifacts/diagnostics/representative-a11y.json' }
        run: |
          set -o pipefail
          bash scripts/ci/with-production-nginx.sh 4176 node tests/representative-a11y.mjs 2>&1 | tee artifacts/diagnostics/representative-a11y.log
      - name: Critical browser smoke
        env:
          AIZANOI_BROWSER: 'chromium'
          ANCIENT_WORLD_BASE_URL: 'http://127.0.0.1:4173'
        run: |
          set -o pipefail
          status=0
          node tests/cross-browser-critical.mjs 2>&1 | tee artifacts/diagnostics/cross-browser-critical.log || status=1
          node tests/cross-device-critical.mjs 2>&1 | tee artifacts/diagnostics/cross-device-critical.log || status=1
          node tests/service-worker-browser.mjs 2>&1 | tee artifacts/diagnostics/service-worker-browser.log || status=1
          exit $status
      - name: Aizanoi world WebGL smoke
        env:
          ANCIENT_WORLD_BASE_URL: 'http://127.0.0.1:4173'
        run: |
          set -o pipefail
          node tests/aizanoi-browser-smoke.mjs 2>&1 | tee artifacts/diagnostics/aizanoi-browser-smoke.log
      - name: AizanoiOS Aizanoi launch smoke
        env:
          ANCIENT_WORLD_BASE_URL: 'http://127.0.0.1:4173'
        run: |
          set -o pipefail
          node --test tests/browser/aizanoi-os-launch.test.mjs 2>&1 | tee artifacts/diagnostics/aizanoi-os-launch.log
      - name: Dungeon 3D facade QA
        env:
          AIZANOI_HTTP_BASE: 'http://127.0.0.1:4173'
          QA_BASE: 'http://127.0.0.1:4173'
          DG_BASE: 'http://127.0.0.1:4173'
        run: |
          set -o pipefail
          status=0
          node --test tests/dungeon-3d-facade.test.mjs 2>&1 | tee artifacts/diagnostics/dungeon-3d-facade.log || status=1
          exit $status
      - name: Dungeon 3D playable run QA
        env:
          ANCIENT_WORLD_BASE_URL: 'http://127.0.0.1:4173'
        run: |
          set -o pipefail
          status=0
          node --test tests/browser/dungeon-3d-play.test.mjs 2>&1 | tee artifacts/diagnostics/dungeon-3d-play.log || status=1
          node --test tests/browser/dungeon-3d-ferryman.test.mjs 2>&1 | tee artifacts/diagnostics/dungeon-3d-ferryman.log || status=1
          node --test tests/browser/dungeon-3d-persistence.test.mjs 2>&1 | tee artifacts/diagnostics/dungeon-3d-persistence.log || status=1
          node --test tests/browser/dungeon-3d-victory.test.mjs 2>&1 | tee artifacts/diagnostics/dungeon-3d-victory.log || status=1
          node --test tests/browser/dungeon-3d-shell-tokens.test.mjs 2>&1 | tee artifacts/diagnostics/dungeon-3d-shell-tokens.log || status=1
          node --test tests/browser/dungeon-3d-core-blockers.test.mjs 2>&1 | tee artifacts/diagnostics/dungeon-3d-core-blockers.log || status=1
          exit $status
      - name: AizanoiOS Arcade and TV surface QA
        env:
          ANCIENT_WORLD_BASE_URL: 'http://127.0.0.1:4173'
        run: |
          set -o pipefail
          node --test tests/browser/aizanoi-os-snake-royale.test.mjs 2>&1 | tee artifacts/diagnostics/aizanoi-os-snake-royale.log
          node --test tests/browser/aizanoi-os-videos.test.mjs 2>&1 | tee artifacts/diagnostics/aizanoi-os-videos.log
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: aizanoi-browser-diagnostics, path: 'artifacts/diagnostics/*', retention-days: 3 }

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned Lighthouse dependencies
        run: |
          npm ci --ignore-scripts --no-fund
          node scripts/ci/npm-audit-gate.mjs
      - name: Build generated News surfaces
        run: node scripts/news/build-news.mjs
      - name: Install production Nginx
        run: |
          # Same transient-mirror retry as the validate job's Nginx install.
          for attempt in 1 2 3; do
            if sudo apt-get update -qq; then break; fi
            [ "$attempt" = 3 ] && exit 1
            echo "apt-get update failed (attempt $attempt), retrying..."; sleep 15
          done
          for attempt in 1 2 3; do
            if sudo apt-get install -y --no-install-recommends nginx; then break; fi
            [ "$attempt" = 3 ] && exit 1
            echo "apt-get install failed (attempt $attempt), retrying..."; sleep 15
          done
      - name: Enforce representative Lighthouse budgets
        env:
          AIZANOI_LIGHTHOUSE_DIR: 'artifacts/diagnostics/representative-lighthouse'
          AIZANOI_LIGHTHOUSE_ATTEMPTS: '1'
        run: |
          mkdir -p artifacts/diagnostics
          set -o pipefail
          bash scripts/ci/with-production-nginx.sh 4177 node tests/representative-lighthouse.mjs 2>&1 | tee artifacts/diagnostics/representative-lighthouse.log
      - name: Upload Lighthouse diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: aizanoi-lighthouse-diagnostics, path: 'artifacts/diagnostics/*', retention-days: 3 }
