name: Aizanoi CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'security/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: aizanoi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check frontend/games/mines.js
          node --check frontend/games/snake.js
          node --check frontend/games/brick.js
          node --check frontend/games/game-utils.js
          node --check frontend/js/chat.js
          node --check frontend/js/terminal.js
          node --check frontend/js/os-router.js
          node --check frontend/js/os-state.js
          node --check frontend/js/os-shell.js
          node --check frontend/js/os-intent.js
          node --check frontend/js/os-legacy-sanitizer.js
          node --check frontend/js/os-v2.js
          node --check frontend/js/os-unified.js
          node --check frontend/js/os-product-polish.js
          node --check frontend/js/os-platform.js
          node --check frontend/js/os-archive.js
          node --check frontend/js/os-workbench.js
          node --check frontend/js/os-workbench-archive.js
          node --check frontend/js/os-workbench-readers.js
          node --check frontend/js/os-workbench-data.js
          node --check frontend/js/os-workbench-shell.js
          node --check frontend/service-worker.js
          node --check frontend/historic-world/app.js
          node --check frontend/ancient-world/engine/traversal.js
          node --check frontend/ancient-world/engine/lifecycle.js
          node --check frontend/ancient-world/engine/navigation.js
          node --check frontend/ancient-world/engine/evidence.js
          node --check frontend/ancient-world/engine/city-contract.js
          node --check frontend/ancient-world/engine/performance.js
          node --check frontend/ancient-world/engine/mobile-controls.js
          node --check frontend/ancient-world/engine/surface-shader.js
          node --check frontend/ancient-world/engine/environment-renderer.js
          node --check frontend/ancient-world/engine/landmark-framing.js
          node --check frontend/ancient-world/assets/materials.js
          node --check frontend/ancient-cities/rome-410-476/data/terrain.js
          node --check frontend/ancient-cities/rome-410-476/data/urban-fabric.js
          node --check frontend/ancient-cities/rome-410-476/data/manifest.js
          node --check frontend/ancient-cities/rome-410-476/js/methodology.js
          node --check frontend/ancient-cities/rome-410-476/js/app.js
          node --check frontend/ancient-cities/athens-450-430/data/city.js
          node --check frontend/ancient-cities/athens-450-430/data/terrain.js
          node --check frontend/ancient-cities/athens-450-430/data/urban-fabric.js
          node --check frontend/ancient-cities/athens-450-430/data/manifest.js
          node --check frontend/ancient-cities/athens-450-430/js/methodology.js
          node --check frontend/ancient-cities/athens-450-430/js/app.js
          node --check frontend/ancient-cities/_template/data/city.example.js
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install and audit Chromium smoke dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts playwright@1.62.1
          npm audit --audit-level=high
          npx playwright install chromium
      - name: Start static frontend server
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/aizanoi-http.log 2>&1 &
          echo $! >/tmp/aizanoi-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/aizanoi-http.log
          exit 1
      - name: Ancient World and Aizanoi OS desktop/tablet/mobile smoke
        env:
          ANCIENT_WORLD_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          mkdir -p artifacts/diagnostics
          status=0
          for script in ancient-city-browser-smoke.mjs os-browser-smoke.mjs os-world-ai-browser-smoke.mjs os-workstation-browser-smoke.mjs terminal-browser-smoke.mjs os-unified-shell-browser-smoke.mjs os-product-polish-browser-smoke.mjs os-command-ai-disabled-browser-smoke.mjs; do
            echo "=== $script ===" | tee "artifacts/diagnostics/$script.log"
            node "tests/$script" 2>&1 | tee -a "artifacts/diagnostics/$script.log" || status=1
          done
          cp /tmp/aizanoi-http.log artifacts/diagnostics/browser-static-server.log || true
          exit $status
      - name: Capture final product visuals
        if: success()
        env:
          ANCIENT_WORLD_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          mkdir -p artifacts/diagnostics
          status=0
          node tests/final-visual-capture.mjs 2>&1 | tee artifacts/diagnostics/final-visual-capture.log || status=1
          node tests/os-distribution-visual-capture.mjs 2>&1 | tee artifacts/diagnostics/os-distribution-visual-capture.log || status=1
          node tests/os-product-polish-visual-capture.mjs 2>&1 | tee artifacts/diagnostics/os-product-polish-visual-capture.log || status=1
          exit $status
      - name: Upload visual regression review
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aizanoi-final-visual-review
          path: artifacts/final-visual-review/*.png
          retention-days: 3
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aizanoi-browser-diagnostics
          path: artifacts/diagnostics/*
          retention-days: 3

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install and audit Lighthouse
        run: |
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts lighthouse@13.4.1
          npm audit --audit-level=high
      - name: Start static frontend server
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/aizanoi-lighthouse-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/aizanoi-lighthouse-http.log
          exit 1
      - name: Enforce Lighthouse budgets
        run: |
          mkdir -p artifacts/diagnostics
          set +e
          passes=0
          valid=0
          for attempt in 1 2 3; do
            report="/tmp/aizanoi-lighthouse-$attempt.json"
            rm -f "$report"
            echo "Lighthouse attempt $attempt" > "artifacts/diagnostics/lighthouse-cli-attempt-$attempt.log"
            npx lighthouse http://127.0.0.1:4173/ \
              --quiet \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --output=json \
              --output-path="$report" \
              >>"artifacts/diagnostics/lighthouse-cli-attempt-$attempt.log" 2>&1
            lighthouse_status=$?
            if [ "$lighthouse_status" -eq 0 ] && [ -s "$report" ]; then
              valid=$((valid + 1))
              cp "$report" "artifacts/diagnostics/lighthouse-report-$attempt.json"
              node tests/lighthouse-budget.mjs "$report" >"artifacts/diagnostics/lighthouse-budget-$attempt.log" 2>&1
              if [ "$?" -eq 0 ]; then
                passes=$((passes + 1))
              fi
            fi
            if [ "$passes" -ge 2 ]; then
              break
            fi
            sleep 1
          done
          echo "Valid Lighthouse reports: $valid; budget passes: $passes" | tee artifacts/diagnostics/lighthouse-summary.log
          cp /tmp/aizanoi-lighthouse-http.log artifacts/diagnostics/lighthouse-static-server.log || true
          set -e
          if [ "$passes" -lt 2 ]; then
            exit 1
          fi
      - name: Upload Lighthouse diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aizanoi-lighthouse-diagnostics
          path: artifacts/diagnostics/*
          retention-days: 3