name: Aizanoi CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'exp/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax checks
        run: |
          node --check backend/server.js
          node --check frontend/games/mines.js
          node --check frontend/games/snake.js
          node --check frontend/games/brick.js
          node --check frontend/ancient-world/engine/traversal.js
          node --check frontend/ancient-world/engine/lifecycle.js
          node --check frontend/ancient-world/engine/navigation.js
          node --check frontend/ancient-world/engine/evidence.js
          node --check frontend/ancient-world/engine/city-contract.js
          node --check frontend/ancient-world/engine/performance.js
          node --check frontend/ancient-world/assets/materials.js
          node --check frontend/ancient-cities/rome-410-476/data/terrain.js
          node --check frontend/ancient-cities/rome-410-476/data/urban-fabric.js
          node --check frontend/ancient-cities/rome-410-476/data/manifest.js
          node --check frontend/ancient-cities/rome-410-476/js/methodology.js
          node --check frontend/ancient-cities/rome-410-476/js/app.js
          node --check frontend/ancient-cities/_template/data/city.example.js
          node --check experiments/threejs-rome-renderer/src/main.js
          node --check experiments/threejs-rome-renderer/src/rome-adapter.js
          node --check experiments/threejs-rome-renderer/src/runtime-controls.js
          node --check experiments/threejs-rome-renderer/src/methodology.js
          node --check experiments/threejs-rome-renderer/src/hero-builders.js
          node --check experiments/threejs-rome-renderer/scripts/vendor-three.mjs
          node --check experiments/threejs-rome-renderer/scripts/browser-smoke.mjs

      - name: Install Three.js experiment dependencies
        if: startsWith(github.ref, 'refs/heads/exp/')
        working-directory: experiments/threejs-rome-renderer
        run: npm install --ignore-scripts --package-lock=false

      - name: Vendor Three.js experiment module
        if: startsWith(github.ref, 'refs/heads/exp/')
        working-directory: experiments/threejs-rome-renderer
        run: |
          npm run vendor
          test -s vendor/three.module.js
          test -s vendor/three.core.js

      - name: Check Three.js experiment sources
        if: startsWith(github.ref, 'refs/heads/exp/')
        working-directory: experiments/threejs-rome-renderer
        run: npm run check

      - name: Verify local Three.js module
        if: startsWith(github.ref, 'refs/heads/exp/')
        run: node -e "import('./experiments/threejs-rome-renderer/vendor/three.module.js').then((THREE)=>{if(typeof THREE.WebGLRenderer!=='function'||typeof THREE.Scene!=='function'||!THREE.REVISION) throw new Error('Vendored Three.js public API is incomplete'); console.log('Three.js '+THREE.REVISION+' loaded locally');})"

      - name: Install Chromium for Three.js browser smoke
        if: startsWith(github.ref, 'refs/heads/exp/')
        working-directory: experiments/threejs-rome-renderer
        run: npx playwright install chromium --with-deps

      - name: Three.js desktop browser smoke
        if: startsWith(github.ref, 'refs/heads/exp/')
        working-directory: experiments/threejs-rome-renderer
        run: npm run browser:smoke -- desktop

      - name: Three.js pointer-lock and focus-loss browser smoke
        if: startsWith(github.ref, 'refs/heads/exp/')
        working-directory: experiments/threejs-rome-renderer
        run: npm run browser:smoke -- input

      - name: Three.js mobile browser smoke
        if: startsWith(github.ref, 'refs/heads/exp/')
        working-directory: experiments/threejs-rome-renderer
        run: npm run browser:smoke -- mobile

      - name: Regression tests
        run: node --test tests/*.test.mjs

      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
