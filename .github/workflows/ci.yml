name: Aizanoi CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'security/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: aizanoi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          set -euo pipefail
          mkdir -p artifacts/diagnostics
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find frontend/js/v3 frontend/games frontend/ancient-world frontend/ancient-cities frontend/historic-world -type f -name '*.js' -print0)
          node --check frontend/service-worker.js
          node --check scripts/news/build-news.mjs
      - name: Build generated News surfaces
        run: node scripts/news/build-news.mjs
      - name: Regression tests
        run: |
          set -o pipefail
          # Top-level regression suite (node:test glob is non-recursive).
          node --test tests/*.test.mjs 2>&1 | tee artifacts/diagnostics/regression-tests.log
      - name: Audit contract tests (security boundary + HR dashboard parity)
        run: |
          set -o pipefail
          # These live in tests/audit/ and are NOT matched by tests/*.test.mjs.
          # They are the enforceable contract for the public-only publish
          # boundary (per owner decision 2026-08-26) and HR dashboard metadata
          # parity, so they MUST run on every PR.
          node --test tests/audit/*.test.mjs 2>&1 | tee artifacts/diagnostics/audit-contract-tests.log
      - name: Reject whitespace errors
        if: success()
        run: git diff --check HEAD^ HEAD
      - name: Upload validate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aizanoi-validate-diagnostics
          path: artifacts/diagnostics/*
          retention-days: 3

  hr-pipeline-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Install locked HR pipeline dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Capture committed integrated-workbook baseline
        run: |
          cp analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/icmal_sorgu_sonuc.xlsx \
            /tmp/hr-integrated-baseline.xlsx
      - name: Rebuild HR Analytics Full Set from committed synthetic inputs
        run: |
          set -o pipefail
          mkdir -p artifacts/diagnostics
          bash scripts/regenerate-hr-dashboards.sh 2>&1 | tee artifacts/diagnostics/hr-pipeline-rebuild.log
      - name: Verify deterministic tracked outputs
        run: |
          set -euo pipefail
          python scripts/verify-hr-workbook-semantics.py \
            /tmp/hr-integrated-baseline.xlsx \
            analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/icmal_sorgu_sonuc.xlsx \
            2>&1 | tee artifacts/diagnostics/hr-workbook-semantics.log
          git diff --exit-code -- \
            ':(glob)frontend/analytics/dashboards/hr-analytics-full-set/**/*.html'
          git diff --check
      - name: Upload HR rebuild diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aizanoi-hr-pipeline-diagnostics
          path: artifacts/diagnostics/*
          retention-days: 3

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install and audit browser QA dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts playwright@1.62.1 axe-core@4.10.3
          npm audit --audit-level=high
          npx playwright install chromium
      - name: Build generated News surfaces
        run: node scripts/news/build-news.mjs
      - name: Start static frontend server
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/aizanoi-http.log 2>&1 &
          echo $! >/tmp/aizanoi-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/aizanoi-http.log
          exit 1
      - name: Field System browser gate
        env:
          ANCIENT_WORLD_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          mkdir -p artifacts/diagnostics
          echo "=== field-system-v3-browser-smoke.mjs ===" | tee artifacts/diagnostics/field-system-v3-browser-smoke.mjs.log
          node tests/field-system-v3-browser-smoke.mjs 2>&1 | tee -a artifacts/diagnostics/field-system-v3-browser-smoke.mjs.log
      - name: Service worker browser lifecycle gate
        env:
          ANCIENT_WORLD_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          node tests/service-worker-browser.mjs 2>&1 | tee artifacts/diagnostics/service-worker-browser.log
      - name: Historical Worlds browser gates
        env:
          ANCIENT_WORLD_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          status=0
          for script in ancient-city-browser-smoke.mjs historical-worlds-ui-browser-smoke.mjs historical-worlds-landmark-walk.mjs; do
            echo "=== $script ===" | tee "artifacts/diagnostics/$script.log"
            node "tests/$script" 2>&1 | tee -a "artifacts/diagnostics/$script.log" || status=1
          done
          cp /tmp/aizanoi-http.log artifacts/diagnostics/browser-static-server.log || true
          exit $status
      - name: HR Analytics Full Set browser gates
        env:
          ANCIENT_WORLD_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          status=0
          node tests/hr-analytics-browser-qa.mjs 2>&1 | tee artifacts/diagnostics/hr-analytics-browser-qa.log || status=1
          node --test tests/browser/workspace-apps.test.mjs 2>&1 | tee artifacts/diagnostics/workspace-apps-browser.log || status=1
          exit $status
      - name: Capture final product visuals
        if: success()
        env:
          ANCIENT_WORLD_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          mkdir -p artifacts/diagnostics
          status=0
          node tests/historical-worlds-visual-capture.mjs 2>&1 | tee artifacts/diagnostics/historical-worlds-visual-capture.log || status=1
          node tests/field-system-v3-visual-capture.mjs 2>&1 | tee artifacts/diagnostics/field-system-v3-visual-capture.log || status=1
          exit $status
      - name: Upload visual regression review
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aizanoi-final-visual-review
          path: artifacts/final-visual-review/*.png
          retention-days: 3
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aizanoi-browser-diagnostics
          path: artifacts/diagnostics/*
          retention-days: 3

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install and audit Lighthouse
        run: |
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts lighthouse@13.4.1
          npm audit --audit-level=high
      - name: Build generated News surfaces
        run: node scripts/news/build-news.mjs
      - name: Start static frontend server
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/aizanoi-lighthouse-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/aizanoi-lighthouse-http.log
          exit 1
      - name: Enforce Lighthouse budgets
        run: |
          mkdir -p artifacts/diagnostics
          set +e
          passes=0
          valid=0
          for attempt in 1 2 3; do
            report="/tmp/aizanoi-lighthouse-$attempt.json"
            rm -f "$report"
            echo "Lighthouse attempt $attempt" > "artifacts/diagnostics/lighthouse-cli-attempt-$attempt.log"
            npx lighthouse http://127.0.0.1:4173/ \
              --quiet \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --output=json \
              --output-path="$report" \
              >>"artifacts/diagnostics/lighthouse-cli-attempt-$attempt.log" 2>&1
            lighthouse_status=$?
            if [ "$lighthouse_status" -eq 0 ] && [ -s "$report" ]; then
              valid=$((valid + 1))
              cp "$report" "artifacts/diagnostics/lighthouse-report-$attempt.json"
              node tests/lighthouse-budget.mjs "$report" >"artifacts/diagnostics/lighthouse-budget-$attempt.log" 2>&1
              if [ "$?" -eq 0 ]; then
                passes=$((passes + 1))
              fi
            fi
            if [ "$passes" -ge 2 ]; then
              break
            fi
            sleep 1
          done
          echo "Valid Lighthouse reports: $valid; budget passes: $passes" | tee artifacts/diagnostics/lighthouse-summary.log
          cp /tmp/aizanoi-lighthouse-http.log artifacts/diagnostics/lighthouse-static-server.log || true
          set -e
          if [ "$passes" -lt 2 ]; then
            exit 1
          fi
      - name: Upload Lighthouse diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aizanoi-lighthouse-diagnostics
          path: artifacts/diagnostics/*
          retention-days: 3
