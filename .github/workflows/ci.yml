name: Aizanoi CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  # TEMP_OS_PATCH_START
  patch-os-product-polish:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/aizanoi-os-product-polish-v2'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aizanoi-os-product-polish-v2
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded OS V2 patch
        run: python3 scripts/patch-os-product-polish-v2.py
      - name: Normalize generated test literal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/os-product-polish.test.mjs')
          text=path.read_text()
          broken="const added = [osJs,osCss,games].join('\n');"
          text=text.replace(broken,"const added = [osJs,osCss,games].join('');")
          path.write_text(text)
          PY
      - name: Validate before commit
        run: |
          node --check frontend/games/game-utils.js
          node --check frontend/js/os-v2.js
          node --check frontend/games/mines.js
          node --check frontend/games/snake.js
          node --check frontend/games/brick.js
          node --test tests/*.test.mjs
          git diff --check
      - name: Keep workflow files unchanged for bot push
        run: |
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/apply-os-product-polish-v2.yml
          rm -f scripts/patch-os-product-polish-v2.py
      - name: Commit product files only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: finish Aizanoi OS single-publisher product polish"
          git push origin HEAD:feat/aizanoi-os-product-polish-v2
  # TEMP_OS_PATCH_END

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax checks
        run: |
          node --check backend/server.js
          node --check frontend/games/mines.js
          node --check frontend/games/snake.js
          node --check frontend/games/brick.js
          node --check frontend/ancient-world/engine/traversal.js
          node --check frontend/ancient-world/engine/lifecycle.js
          node --check frontend/ancient-world/engine/navigation.js
          node --check frontend/ancient-world/engine/evidence.js
          node --check frontend/ancient-world/engine/city-contract.js
          node --check frontend/ancient-world/engine/performance.js
          node --check frontend/ancient-world/engine/mobile-controls.js
          node --check frontend/ancient-world/engine/surface-shader.js
          node --check frontend/ancient-world/engine/environment-renderer.js
          node --check frontend/ancient-world/assets/materials.js
          node --check frontend/ancient-cities/rome-410-476/data/terrain.js
          node --check frontend/ancient-cities/rome-410-476/data/urban-fabric.js
          node --check frontend/ancient-cities/rome-410-476/data/manifest.js
          node --check frontend/ancient-cities/rome-410-476/js/methodology.js
          node --check frontend/ancient-cities/rome-410-476/js/app.js
          node --check frontend/ancient-cities/athens-450-430/data/city.js
          node --check frontend/ancient-cities/athens-450-430/data/terrain.js
          node --check frontend/ancient-cities/athens-450-430/data/urban-fabric.js
          node --check frontend/ancient-cities/athens-450-430/data/manifest.js
          node --check frontend/ancient-cities/athens-450-430/js/methodology.js
          node --check frontend/ancient-cities/athens-450-430/js/app.js
          node --check frontend/ancient-cities/_template/data/city.example.js

      - name: Regression tests
        run: node --test tests/*.test.mjs

      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD

  ancient-city-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium smoke dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Start static frontend server
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/aizanoi-http.log 2>&1 &
          echo $! >/tmp/aizanoi-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/aizanoi-http.log
          exit 1

      - name: Rome and Athens desktop/mobile browser smoke
        env:
          ANCIENT_WORLD_BASE_URL: http://127.0.0.1:4173
        run: node tests/ancient-city-browser-smoke.mjs
