name: Recruitment mobile header fix

on:
  push:
    branches:
      - feat/recruitment-multiselect-settings

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/recruitment-multiselect-settings
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply guarded mobile header constraints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/analytics/dashboards/new-hr-collection/recruitment-analytics/index.html')
          html = path.read_text(encoding='utf-8')
          old = '''      .multi-filter-trigger { min-width: 0; }
                .settings-transfer-grid { grid-template-columns: minmax(0, 1fr); min-width: 0; }'''
          new = '''      .multi-filter-trigger { min-width: 0; }
                .header-top { flex-direction: column; align-items: stretch; }
                .brand-group, .header-meta, .header-actions { width: 100%; min-width: 0; }
                .header-meta { justify-content: flex-start; }
                .status-pill { max-width: 100%; min-width: 0; flex-wrap: wrap; }
                #datasetMeta { min-width: 0; overflow-wrap: anywhere; }
                .header-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
                .header-actions .btn { width: 100%; min-width: 0; max-width: 100%; white-space: normal; }
                .settings-transfer-grid { grid-template-columns: minmax(0, 1fr); min-width: 0; }'''
          if html.count(old) != 1:
              raise SystemExit(f'mobile header anchor count={html.count(old)}')
          path.write_text(html.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Focused static regression
        run: node --test tests/recruitment-analytics-multiselect-settings.test.mjs
      - name: Focused Chromium regression
        run: |
          npm ci --ignore-scripts --no-fund
          npx playwright install chromium
          python3 -m http.server 4173 --directory frontend >/tmp/recruitment-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.5; done
          node tests/recruitment-analytics-browser-qa.mjs
      - name: Commit verified responsive fix
        run: |
          rm .github/workflows/recruitment-mobile-header-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(recruitment): make mobile header responsive'
          git push origin HEAD:feat/recruitment-multiselect-settings
