name: Apply one-shot index audit fixes

on:
  push:
    branches:
      - fix/audit-hardening-2026-08-17

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-hardening-2026-08-17
          fetch-depth: 0

      - name: Apply guarded index patch
        run: python3 tools/apply-index-audit-fixes.py

      - name: Validate patched source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/index.html')
          s = p.read_text(encoding='utf-8')
          checks = {
              'market icon mapping removed': "market:'/icons/Run.png'" not in s,
              'market app key removed': "'market':'market'" not in s,
              'UNESCO status corrected': "Tentative List since 2012" in s,
              'bad UNESCO 2025 claim removed': "World Heritage List in 2025" not in s,
              'control panel opens correct app': "a === 'control') openApp('control')" in s,
              'early boot escape exists': '__aizanoiBootEscape' in s,
              'Aizanoi TV desktop entry exists': "id: 'videos'" in s,
              'visible AizanoiOS token removed': 'AizanoiOS' not in s,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('OK   ' if ok else 'FAIL ') + name)
          if failed:
              raise SystemExit('Validation failed: ' + ', '.join(failed))
          PY

      - name: Remove one-shot tooling
        run: |
          rm -f tools/apply-index-audit-fixes.py
          rm -f .github/workflows/apply-index-audit-fixes.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          rmdir tools 2>/dev/null || true

      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden Aizanoi OS shell after audit"
          git push origin HEAD:fix/audit-hardening-2026-08-17
