name: Temporary HR English Candidate

on:
  push:
    branches:
      - feat/hr-dashboard-english-only-v3

permissions:
  contents: read

concurrency:
  group: temporary-hr-english-candidate-v3
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
          npm ci --ignore-scripts --no-fund
          npx playwright install chromium
      - name: Canonical rebuild
        run: bash scripts/regenerate-hr-dashboards.sh >/tmp/hr-rebuild.log 2>&1
      - name: Permanent QA concise diagnostic
        shell: bash
        run: |
          set -uo pipefail
          python3 -m http.server 4173 --directory frontend >/tmp/hr-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/analytics/dashboards/hr-analytics-full-set/ >/dev/null; then break; fi
            sleep 1
          done
          set +e
          ANCIENT_WORLD_BASE_URL=http://127.0.0.1:4173 node tests/hr-analytics-browser-qa.mjs >/tmp/hr-qa.log 2>&1
          status=$?
          set -e
          echo '=== PERMANENT QA FAILURE SUMMARY ==='
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/hr-qa.log').read_text(errors='replace').splitlines()
          markers=('AssertionError','ERR_ASSERTION','residual','console','overflow','pageerror','desktop','mobile','lang=', 'actual:', 'expected:', 'operator:')
          idx=[i for i,line in enumerate(lines) if any(m in line.lower() for m in [x.lower() for x in markers])]
          if idx:
              keep=set()
              for i in idx:
                  keep.update(range(max(0,i-3),min(len(lines),i+7)))
              selected=[lines[i] for i in sorted(keep)]
          else:
              selected=lines[-120:]
          print('\n'.join(selected[-180:]))
          PY
          echo "QA_EXIT=${status}"
          exit "$status"
