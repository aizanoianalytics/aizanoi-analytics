name: Temporary HR English Candidate

on:
  push:
    branches:
      - feat/hr-dashboard-english-only-v3

permissions:
  contents: read

concurrency:
  group: temporary-hr-english-candidate-v3
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
          npm ci --ignore-scripts --no-fund
          npx playwright install chromium
      - name: Canonical rebuild
        run: bash scripts/regenerate-hr-dashboards.sh >/tmp/hr-rebuild.log 2>&1
      - name: Trace Corporate Goals overflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory frontend >/tmp/hr-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/analytics/dashboards/hr-analytics-full-set/corporate-goals/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          await page.goto('http://127.0.0.1:4173/analytics/dashboards/hr-analytics-full-set/corporate-goals/',{waitUntil:'networkidle'});
          await page.waitForTimeout(500);
          const report=await page.evaluate(()=>{
            const vw=document.documentElement.clientWidth;
            const doc={scrollWidth:document.documentElement.scrollWidth,clientWidth:vw};
            const offenders=[];
            for(const el of document.querySelectorAll('body *')){
              const cs=getComputedStyle(el);
              if(cs.display==='none'||cs.visibility==='hidden')continue;
              const r=el.getBoundingClientRect();
              const outside=r.right>vw+1||r.left<-1;
              const intrinsic=el.scrollWidth>el.clientWidth+1 && !['auto','scroll','hidden','clip'].includes(cs.overflowX);
              if(!outside&&!intrinsic)continue;
              offenders.push({
                tag:el.tagName.toLowerCase(),id:el.id||'',cls:String(el.className||'').slice(0,140),
                left:+r.left.toFixed(1),right:+r.right.toFixed(1),width:+r.width.toFixed(1),
                scrollWidth:el.scrollWidth,clientWidth:el.clientWidth,overflowX:cs.overflowX,
                display:cs.display,position:cs.position,text:(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim().slice(0,220)
              });
            }
            return {doc,offenders:offenders.slice(0,80)};
          });
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          NODE
