name: HR Final Determinism Once

on:
  push:
    branches:
      - fix/restore-original-hr-pipeline-synthetic-data
    paths:
      - .github/workflows/hr-final-determinism-once.yml

permissions:
  contents: write

jobs:
  fix-and-rebaseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Make executive dashboard metadata deterministic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('analytics/dashboards/hr-analytics-full-set/production-pipeline/refresh_data.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '    pages["p016_forecasts"] = {"rows": rows, "backtest": backtest_rows}\n\n    if not tahmin_yillik_backtest_df.empty:\n',
              '    pages["p016_forecasts"] = {"rows": rows, "backtest": backtest_rows}\n\n'
              '    stable_year_values = pd.to_numeric(\n'
              '        df.get("year", pd.Series(dtype="float64")), errors="coerce"\n'
              '    ).dropna()\n'
              '    stable_data_year = int(stable_year_values.max()) if not stable_year_values.empty else 1970\n\n'
              '    if not tahmin_yillik_backtest_df.empty:\n',
              'stable annual fallback anchor',
          )
          replace_once(
              '        annual_year = int(year_values.max()) if not year_values.empty else datetime.now().year\n',
              '        annual_year = int(year_values.max()) if not year_values.empty else stable_data_year\n',
              'annual year fallback with data',
          )
          replace_once(
              '        annual_year = datetime.now().year\n',
              '        annual_year = stable_data_year\n',
              'annual year fallback without data',
          )
          replace_once(
              '        "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),\n',
              '        # Static build metadata follows the latest dataset snapshot so identical inputs\n'
              '        # always produce identical tracked HTML across machines and calendar time.\n'
              '        "generated_at": (f"{months_sorted[-1]}-01T00:00:00Z" if months_sorted else "1970-01-01T00:00:00Z"),\n',
              'generated-at metadata',
          )

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile analytics/dashboards/hr-analytics-full-set/production-pipeline/refresh_data.py
          if grep -nE 'annual_year = .*datetime\.now\(\)\.year|"generated_at": datetime\.now' analytics/dashboards/hr-analytics-full-set/production-pipeline/refresh_data.py; then
            echo 'Output-affecting wall-clock fallback remains in refresh_data.py' >&2
            exit 1
          fi
          git diff --check
      - name: Install locked HR pipeline dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Rebuild and audit HR Analytics Full Set
        run: bash scripts/regenerate-hr-dashboards.sh
      - name: Commit deterministic source and production artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            analytics/dashboards/hr-analytics-full-set/production-pipeline/refresh_data.py \
            analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar \
            frontend/analytics/dashboards/hr-analytics-full-set

          while IFS= read -r path; do
            case "$path" in
              analytics/dashboards/hr-analytics-full-set/production-pipeline/refresh_data.py) ;;
              analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/*.html) ;;
              analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/icmal_sorgu_sonuc.xlsx) ;;
              frontend/analytics/dashboards/hr-analytics-full-set/*.html) ;;
              frontend/analytics/dashboards/hr-analytics-full-set/*/*.html) ;;
              frontend/analytics/dashboards/hr-analytics-full-set/*/*/*.html) ;;
              frontend/analytics/dashboards/hr-analytics-full-set/downloads/hr-analytics-full-set-synthetic-output.xlsx) ;;
              "") ;;
              *) echo "Unexpected tracked HR output: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)

          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: make executive HR builds reproducible"
          git push origin HEAD:fix/restore-original-hr-pipeline-synthetic-data
