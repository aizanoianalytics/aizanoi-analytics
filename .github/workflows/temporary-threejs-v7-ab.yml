name: Temporary Three.js V7 A/B

on:
  push:
    branches:
      - exp/threejs-rome-renderer-poc

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install experiment dependencies
        working-directory: experiments/threejs-rome-renderer
        run: npm install --ignore-scripts --package-lock=false
      - name: Vendor Three.js
        working-directory: experiments/threejs-rome-renderer
        run: npm run vendor
      - name: Install Chromium
        working-directory: experiments/threejs-rome-renderer
        run: npx playwright install chromium --with-deps
      - name: Capture V7 matched baselines
        working-directory: experiments/threejs-rome-renderer
        run: npm run capture:ab
      - name: Upload V7 A/B artifact
        uses: actions/upload-artifact@v4
        with:
          name: rome-renderer-v7-ab
          path: experiments/threejs-rome-renderer/visual-baseline/*.png
          retention-days: 2
