name: Temporary HR HTML Hardening Finalize

on:
  push:
    branches:
      - fix/hr-synthetic-historical-dates

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/hr-synthetic-historical-dates
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install locked HR dependencies
        run: python -m pip install -r analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt

      - name: Rebuild hardened canonical HR artifacts
        run: bash scripts/regenerate-hr-dashboards.sh

      - name: Verify and commit only intended generated hardening
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/diagnostics
          rm -f .github/workflows/_temporary-codeql-sarif-inspect.yml
          rm -f .github/workflows/_temporary-hr-html-hardening-finalize.yml

          git add -A
          git diff --cached --check
          git diff --cached --name-only | sort | tee /tmp/hr-hardening-changed.txt

          python - <<'PY'
          from pathlib import Path

          changed = {line.strip() for line in Path('/tmp/hr-hardening-changed.txt').read_text().splitlines() if line.strip()}
          allowed = {
              '.github/workflows/_temporary-codeql-sarif-inspect.yml',
              '.github/workflows/_temporary-hr-html-hardening-finalize.yml',
              'analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/ERD_P_admin.html',
              'analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/magaza_takip_dosya.html',
              'frontend/analytics/dashboards/hr-analytics-full-set/hr-administration-deep-dive/index.html',
              'frontend/analytics/dashboards/hr-analytics-full-set/store-operations-tracking/index.html',
          }
          required = {
              'analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/ERD_P_admin.html',
              'analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/magaza_takip_dosya.html',
              'frontend/analytics/dashboards/hr-analytics-full-set/hr-administration-deep-dive/index.html',
              'frontend/analytics/dashboards/hr-analytics-full-set/store-operations-tracking/index.html',
          }
          unexpected = sorted(changed - allowed)
          missing = sorted(required - changed)
          if unexpected:
              raise SystemExit('Unexpected generated changes:\n' + '\n'.join(unexpected))
          if missing:
              raise SystemExit('Expected hardened artifacts did not change:\n' + '\n'.join(missing))
          PY

          git config user.name aizanoi-ci
          git config user.email actions@users.noreply.github.com
          git commit -m "security(hr): harden generated HTML before publish"
          git push origin HEAD:fix/hr-synthetic-historical-dates
