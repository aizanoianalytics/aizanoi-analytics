name: Temporary HR Method Map Fix

on:
  push:
    branches:
      - feat/hr-dashboard-english-only-v3
    paths:
      - .github/workflows/_temporary-hr-method-map-fix.yml
      - scripts/hr/_temporary_patch_corporate_method_map.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python scripts/hr/_temporary_patch_corporate_method_map.py
      - run: |
          set -euo pipefail
          node --check frontend/analytics/dashboards/hr-analytics-full-set/hr-public-en-visible.js
          git add frontend/analytics/dashboards/hr-analytics-full-set/hr-public-en-visible.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(hr): translate Corporate Goals methodology copy'
          git push origin HEAD:feat/hr-dashboard-english-only-v3
