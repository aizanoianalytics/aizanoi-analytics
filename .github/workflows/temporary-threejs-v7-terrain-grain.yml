name: Temporary Three.js V7 Terrain Grain

on:
  push:
    branches:
      - exp/threejs-rome-renderer-poc

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: exp/threejs-rome-renderer-poc
      - name: Add terrain-only fragment grain material
        run: |
          cat > experiments/threejs-rome-renderer/src/terrain-material.js <<'EOF'
          export const ROME_TERRAIN_FRAGMENT_GRAIN = Object.freeze({
            cellScale: 0.72,
            amplitude: 0.035,
          });

          export function createTerrainMaterial(THREE) {
            if (!THREE?.MeshStandardMaterial) throw new TypeError('createTerrainMaterial requires THREE.MeshStandardMaterial.');

            const material = new THREE.MeshStandardMaterial({
              color: 0xffffff,
              roughness: 1,
              metalness: 0,
              vertexColors: true,
            });

            material.onBeforeCompile = (shader) => {
              const vertexMain = 'void main() {';
              const beginVertex = '#include <begin_vertex>';
              const fragmentMain = 'void main() {';
              const colorFragment = '#include <color_fragment>';

              if (!shader.vertexShader.includes(vertexMain) || !shader.vertexShader.includes(beginVertex)) {
                throw new Error('Three.js terrain vertex shader markers changed; refusing an unverified grain patch.');
              }
              if (!shader.fragmentShader.includes(fragmentMain) || !shader.fragmentShader.includes(colorFragment)) {
                throw new Error('Three.js terrain fragment shader markers changed; refusing an unverified grain patch.');
              }

              shader.vertexShader = shader.vertexShader
                .replace(vertexMain, `varying vec2 vRomeTerrainXZ;\n${vertexMain}`)
                .replace(beginVertex, `${beginVertex}\n  vRomeTerrainXZ = position.xz;`);

              shader.fragmentShader = shader.fragmentShader
                .replace(fragmentMain, `varying vec2 vRomeTerrainXZ;\nfloat romeTerrainHash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }\n${fragmentMain}`)
                .replace(colorFragment, `${colorFragment}\n  float romeTerrainGrain = (romeTerrainHash(floor(vRomeTerrainXZ * 0.72)) - 0.5) * 0.035;\n  diffuseColor.rgb *= 1.0 + romeTerrainGrain;`);
            };

            material.customProgramCacheKey = () => 'rome-terrain-fragment-grain-v1';
            return material;
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          main = Path('experiments/threejs-rome-renderer/src/main.js')
          text = main.read_text()
          patches = [
              (
                  "import { createTerrainColorSampler, ROME_VISUAL_PALETTE } from './visual-palette.js';",
                  "import { createTerrainColorSampler, ROME_VISUAL_PALETTE } from './visual-palette.js';\nimport { createTerrainMaterial } from './terrain-material.js';",
              ),
              (
                  """function terrainMaterial(THREE) {\n  return new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, metalness: 0, vertexColors: true });\n}\n\n""",
                  "",
              ),
              (
                  "const mesh = new THREE.Mesh(geometry, terrainMaterial(THREE));",
                  "const mesh = new THREE.Mesh(geometry, createTerrainMaterial(THREE));",
              ),
          ]
          for old, new in patches:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'main.js guard failed: expected one match, found {count}')
              text = text.replace(old, new, 1)
          main.write_text(text)

          package = Path('experiments/threejs-rome-renderer/package.json')
          text = package.read_text()
          old = 'node --check ./src/visual-palette.js && node --check ./scripts/vendor-three.mjs'
          new = 'node --check ./src/visual-palette.js && node --check ./src/terrain-material.js && node --check ./scripts/vendor-three.mjs'
          if text.count(old) != 1:
              raise SystemExit('package.json guard failed')
          package.write_text(text.replace(old, new, 1))
          PY

          node --check experiments/threejs-rome-renderer/src/terrain-material.js
          node --check experiments/threejs-rome-renderer/src/main.js
          git diff --check
      - name: Commit V7 patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/threejs-rome-renderer/src/terrain-material.js experiments/threejs-rome-renderer/src/main.js experiments/threejs-rome-renderer/package.json
          git rm .github/workflows/temporary-threejs-v7-terrain-grain.yml
          git commit -m 'feat: add terrain-only per-fragment grain to Rome Three.js PoC'
          git push
