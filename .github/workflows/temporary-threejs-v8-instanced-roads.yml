name: Temporary Three.js V8 Instanced Roads

on:
  push:
    branches:
      - exp/threejs-rome-renderer-poc

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: exp/threejs-rome-renderer-poc
      - name: Add instanced terrain-following roads
        run: |
          cat > experiments/threejs-rome-renderer/src/road-builder.js <<'EOF'
          import { ANCIENT_MATERIALS } from '../../../frontend/ancient-world/assets/materials.js';

          export const ROME_ROAD_RENDER_POLICY = Object.freeze({
            desktopPieceLength: 22,
            mobilePieceLength: 30,
            bedLift: 0.045,
            bedThickness: 0.04,
            edgeLift: 0.022,
            edgeThickness: 0.025,
            edgeBandWidth: 0.22,
            edgeInset: 0.17,
          });

          function materialColor(THREE, rgb) {
            return new THREE.Color().setRGB(rgb[0], rgb[1], rgb[2]);
          }

          export function createRoadPiecePlan({ streets, terrainHeightAt, mobile = false }) {
            if (!Array.isArray(streets)) throw new TypeError('createRoadPiecePlan requires a streets array.');
            if (typeof terrainHeightAt !== 'function') throw new TypeError('createRoadPiecePlan requires terrainHeightAt.');

            const maxPieceLength = mobile
              ? ROME_ROAD_RENDER_POLICY.mobilePieceLength
              : ROME_ROAD_RENDER_POLICY.desktopPieceLength;
            const pieces = [];

            for (const road of streets) {
              for (let index = 1; index < road.points.length; index++) {
                const a = road.points[index - 1];
                const b = road.points[index];
                const dx = b[0] - a[0];
                const dz = b[1] - a[1];
                const planarLength = Math.hypot(dx, dz) || 1;
                const subdivisions = Math.max(1, Math.ceil(planarLength / maxPieceLength));

                for (let piece = 0; piece < subdivisions; piece++) {
                  const t0 = piece / subdivisions;
                  const t1 = (piece + 1) / subdivisions;
                  const x0 = a[0] + dx * t0;
                  const z0 = a[1] + dz * t0;
                  const x1 = a[0] + dx * t1;
                  const z1 = a[1] + dz * t1;
                  pieces.push({
                    roadId: road.id,
                    width: road.width,
                    x0,
                    z0,
                    x1,
                    z1,
                    y0: terrainHeightAt(x0, z0) + ROME_ROAD_RENDER_POLICY.bedLift,
                    y1: terrainHeightAt(x1, z1) + ROME_ROAD_RENDER_POLICY.bedLift,
                  });
                }
              }
            }

            return pieces;
          }

          function pieceBasis(THREE, piece) {
            const direction = new THREE.Vector3(
              piece.x1 - piece.x0,
              piece.y1 - piece.y0,
              piece.z1 - piece.z0,
            );
            const length = direction.length() || 1;
            const xAxis = direction.clone().multiplyScalar(1 / length);
            const planarLength = Math.hypot(piece.x1 - piece.x0, piece.z1 - piece.z0) || 1;
            const zAxis = new THREE.Vector3(
              -(piece.z1 - piece.z0) / planarLength,
              0,
              (piece.x1 - piece.x0) / planarLength,
            );
            const yAxis = zAxis.clone().cross(xAxis).normalize();
            const basis = new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis);
            const quaternion = new THREE.Quaternion().setFromRotationMatrix(basis);
            const midpoint = new THREE.Vector3(
              (piece.x0 + piece.x1) / 2,
              (piece.y0 + piece.y1) / 2,
              (piece.z0 + piece.z1) / 2,
            );
            return { length, quaternion, midpoint, yAxis, zAxis };
          }

          export function addInstancedRoads(THREE, scene, simulation, { mobile = false } = {}) {
            const pieces = createRoadPiecePlan({
              streets: simulation.streets,
              terrainHeightAt: simulation.terrainHeightAt,
              mobile,
            });
            if (!pieces.length) return { pieces: 0, drawLayers: 0, edgeInstances: 0 };

            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const bedMaterial = new THREE.MeshStandardMaterial({
              color: materialColor(THREE, ANCIENT_MATERIALS.road),
              roughness: 1,
              metalness: 0,
            });
            const edgeMaterial = new THREE.MeshStandardMaterial({
              color: materialColor(THREE, ANCIENT_MATERIALS.roadEdge),
              roughness: 1,
              metalness: 0,
            });

            const beds = new THREE.InstancedMesh(geometry, bedMaterial, pieces.length);
            beds.name = 'Terrain-following Roman road beds';
            const edges = new THREE.InstancedMesh(geometry, edgeMaterial, pieces.length * 2);
            edges.name = 'Roman road edge bands';

            const matrix = new THREE.Matrix4();
            const scale = new THREE.Vector3();
            const position = new THREE.Vector3();

            pieces.forEach((piece, index) => {
              const { length, quaternion, midpoint, yAxis, zAxis } = pieceBasis(THREE, piece);

              scale.set(length, ROME_ROAD_RENDER_POLICY.bedThickness, piece.width);
              matrix.compose(midpoint, quaternion, scale);
              beds.setMatrixAt(index, matrix);

              const lateral = Math.max(
                0,
                piece.width / 2 - ROME_ROAD_RENDER_POLICY.edgeInset - ROME_ROAD_RENDER_POLICY.edgeBandWidth / 2,
              );
              for (const [sideIndex, side] of [-1, 1].entries()) {
                position.copy(midpoint)
                  .addScaledVector(zAxis, lateral * side)
                  .addScaledVector(yAxis, ROME_ROAD_RENDER_POLICY.edgeLift);
                scale.set(length, ROME_ROAD_RENDER_POLICY.edgeThickness, ROME_ROAD_RENDER_POLICY.edgeBandWidth);
                matrix.compose(position, quaternion, scale);
                edges.setMatrixAt(index * 2 + sideIndex, matrix);
              }
            });

            beds.instanceMatrix.needsUpdate = true;
            edges.instanceMatrix.needsUpdate = true;
            beds.computeBoundingSphere();
            edges.computeBoundingSphere();
            beds.userData.roadBuilder = 'instanced-road-v1';
            beds.userData.benchmark = { pieces: pieces.length, drawLayers: 2, edgeInstances: pieces.length * 2 };
            edges.userData.roadBuilder = 'instanced-road-v1';
            scene.add(beds, edges);

            return beds.userData.benchmark;
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          main = Path('experiments/threejs-rome-renderer/src/main.js')
          text = main.read_text()
          import_old = "import { createTerrainMaterial } from './terrain-material.js';"
          import_new = import_old + "\nimport { addInstancedRoads } from './road-builder.js';"
          if text.count(import_old) != 1:
              raise SystemExit('main import guard failed')
          text = text.replace(import_old, import_new, 1)

          start = text.index('function roadSegment(')
          end = text.index('function addRamp(', start)
          text = text[:start] + text[end:]

          old_call = '  addRoads(THREE, scene, simulation);'
          new_call = '  addInstancedRoads(THREE, scene, simulation, { mobile });'
          if text.count(old_call) != 1:
              raise SystemExit('main road-call guard failed')
          text = text.replace(old_call, new_call, 1)
          main.write_text(text)

          package = Path('experiments/threejs-rome-renderer/package.json')
          text = package.read_text()
          old = 'node --check ./src/terrain-material.js && node --check ./scripts/vendor-three.mjs'
          new = 'node --check ./src/terrain-material.js && node --check ./src/road-builder.js && node --check ./scripts/vendor-three.mjs'
          if text.count(old) != 1:
              raise SystemExit('package guard failed')
          package.write_text(text.replace(old, new, 1))

          smoke = Path('experiments/threejs-rome-renderer/scripts/browser-smoke.mjs')
          text = smoke.read_text()
          old = """      target: api.contract.teleportTargets.find((item) => item.monumentId === 'colosseum') || api.contract.teleportTargets[0],\n      hero,\n"""
          new = """      target: api.contract.teleportTargets.find((item) => item.monumentId === 'colosseum') || api.contract.teleportTargets[0],\n      hero,\n      roads: (() => {\n        const roadBeds = api.scene.getObjectByName('Terrain-following Roman road beds');\n        return roadBeds?.userData?.benchmark || null;\n      })(),\n"""
          if text.count(old) != 1:
              raise SystemExit('browser smoke baseline guard failed')
          text = text.replace(old, new, 1)

          old_assert = """  assert.equal(baseline.hero?.benchmark?.facadeInstances, 216, 'Colosseum hero should render 216 instanced facade piers');\n"""
          new_assert = old_assert + """  assert.ok(baseline.roads?.pieces > 0, 'Rome PoC should expose instanced road pieces');\n  assert.equal(baseline.roads?.drawLayers, 2, 'road renderer should use two instanced draw layers');\n  assert.equal(baseline.roads?.edgeInstances, baseline.roads?.pieces * 2, 'road renderer should provide two edge bands per piece');\n"""
          if text.count(old_assert) != 1:
              raise SystemExit('browser smoke assertion guard failed')
          smoke.write_text(text.replace(old_assert, new_assert, 1))
          PY

          node --check experiments/threejs-rome-renderer/src/road-builder.js
          node --check experiments/threejs-rome-renderer/src/main.js
          node --check experiments/threejs-rome-renderer/scripts/browser-smoke.mjs
          git diff --check
      - name: Commit V8 patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/threejs-rome-renderer/src/road-builder.js experiments/threejs-rome-renderer/src/main.js experiments/threejs-rome-renderer/package.json experiments/threejs-rome-renderer/scripts/browser-smoke.mjs
          git rm .github/workflows/temporary-threejs-v8-instanced-roads.yml
          git commit -m 'feat: batch Rome roads with instanced edge bands'
          git push
