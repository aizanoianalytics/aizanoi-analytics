name: Temporary Rome Methodology Patch

on:
  push:
    branches:
      - feat/ancient-world-city-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ancient-world-city-contract
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Rome methodology UI
        run: python scripts/patch_rome_methodology.py
      - name: Commit exact patch
        run: |
          if git diff --quiet -- frontend/ancient-cities/rome-410-476/index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/ancient-cities/rome-410-476/index.html
          git commit -m "feat: add Rome evidence methodology control"
          git push origin HEAD:feat/ancient-world-city-contract
