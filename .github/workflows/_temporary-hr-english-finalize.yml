name: Temporary HR English Finalize

on:
  push:
    branches:
      - feat/hr-dashboard-english-only-v3

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Install locked validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
          npm ci --ignore-scripts --no-fund
          npx playwright install chromium
      - name: Close final permanent-English residuals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          localizer = Path('scripts/hr/localize-public-dashboard-en.mjs')
          text = localizer.read_text()
          old = '|hedef|hesap|icin|için|izin|kayit|kayıt|kidem|kıdem|'
          new = '|hedef|hesap|hesaplama|icin|için|izin|kayit|kayıt|kaynak|kapsam|kidem|kıdem|'
          if old not in text:
              raise SystemExit('Expected localizer Turkish-word anchor not found')
          text = text.replace(old, new, 1)
          old = '|maas|maaş|merkez|mesai|metrik|'
          new = '|maas|maaş|maksimum|merkez|mesai|metrik|'
          if old not in text:
              raise SystemExit('Expected localizer maximum-word anchor not found')
          text = text.replace(old, new, 1)
          old = '|puan|riskli|saat|'
          new = '|puan|rehberi|riskli|saat|'
          if old not in text:
              raise SystemExit('Expected localizer guide-word anchor not found')
          text = text.replace(old, new, 1)
          localizer.write_text(text)

          map_path = Path('scripts/hr/hr-public-en-presentation-map.json')
          data = json.loads(map_path.read_text())
          exact = data.setdefault('exact', {})
          exact.update({
              'Kapsam': 'Scope',
              'Kapsam · Aurelia Group': 'Scope · Aurelia Group',
              'Kaynak': 'Source',
              'Kaynak Rol': 'Source Role',
              'Hesaplama Rehberi': 'Calculation Guide',
              'Target / Maksimum': 'Target / Maximum',
              'Maksimum: 0': 'Maximum: 0',
              'Kaynak department': 'Source department',
              'Kaynak Department': 'Source Department',
              'Kaynak:': 'Source:',
              'Kapsam:': 'Scope:',
          })
          map_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          git diff --check
      - name: Canonical rebuild and deterministic replay
        shell: bash
        run: |
          set -euo pipefail
          cp analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/icmal_sorgu_sonuc.xlsx /tmp/hr-integrated-baseline.xlsx

          bash scripts/regenerate-hr-dashboards.sh
          python scripts/verify-hr-workbook-semantics.py \
            /tmp/hr-integrated-baseline.xlsx \
            analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/icmal_sorgu_sonuc.xlsx
          git diff --binary > /tmp/hr-first-rebuild.patch
          git diff --check

          bash scripts/regenerate-hr-dashboards.sh
          python scripts/verify-hr-workbook-semantics.py \
            /tmp/hr-integrated-baseline.xlsx \
            analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/icmal_sorgu_sonuc.xlsx
          git diff --binary > /tmp/hr-second-rebuild.patch
          cmp /tmp/hr-first-rebuild.patch /tmp/hr-second-rebuild.patch
          git diff --check
          echo 'Canonical HR rebuild is deterministic across two consecutive runs.'
      - name: Permanent English browser QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory frontend >/tmp/hr-final-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/analytics/dashboards/hr-analytics-full-set/ >/dev/null; then break; fi
            sleep 1
          done
          ANCIENT_WORLD_BASE_URL=http://127.0.0.1:4173 node tests/hr-analytics-browser-qa.mjs
      - name: Remove temporary harness and commit canonical artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/_temporary-hr-english-candidate.yml \
            .github/workflows/_temporary-hr-english-finalize.yml \
            .github/workflows/_temporary-hr-permanent-qa-diagnostic.yml \
            .github/workflows/_temporary-hr-runtime-syntax.yml \
            .github/workflows/_temporary-hr-translate-probe.yml \
            .github/workflows/_temporary-hr-wire-presentation-map.yml \
            scripts/hr/_temporary-hr-public-en-residuals.json \
            scripts/hr/_temporary-hr-v3-trigger.txt
          rm -rf artifacts
          git add -A
          git diff --cached --check
          echo 'Final staged files:'
          git diff --cached --name-status
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(hr): publish English-only analytics presentation'
          git push origin HEAD:feat/hr-dashboard-english-only-v3