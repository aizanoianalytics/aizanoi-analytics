name: Apply Validated Camera Clearance

on:
  push:
    branches: [feat/final-polish-aaa-2026-08-18]
    paths: [.github/workflows/apply-validated-camera-clearance.yml]

permissions:
  contents: write

concurrency:
  group: validated-camera-clearance
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-polish-aaa-2026-08-18
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply already-validated camera clearance patch
        run: python3 scripts/apply-landmark-camera-clearance-2026-08-18.py
      - name: Validate source and tests
        run: |
          node --check frontend/ancient-world/engine/landmark-framing.js
          node --check frontend/ancient-cities/rome-410-476/js/app.js
          node --check frontend/ancient-cities/athens-450-430/js/app.js
          node --test tests/*.test.mjs
          git diff --check
      - name: Commit product patch and remove one-shot machinery
        run: |
          rm -f scripts/apply-landmark-camera-clearance-2026-08-18.py
          rm -f scripts/apply-landmark-sightline-fix-2026-08-18.py
          rm -f scripts/fix-landmark-double-resolve-2026-08-18.py
          rm -f .github/workflows/apply-validated-camera-clearance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend tests scripts .github/workflows
          git diff --cached --check
          git commit -m "fix: keep landmark cameras clear of nearby massing"
          git fetch origin feat/final-polish-aaa-2026-08-18
          git rebase origin/feat/final-polish-aaa-2026-08-18
          git push origin HEAD:feat/final-polish-aaa-2026-08-18
