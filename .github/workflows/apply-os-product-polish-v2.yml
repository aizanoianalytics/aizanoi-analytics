name: Apply Aizanoi OS Product Polish V2

on:
  push:
    branches:
      - feat/aizanoi-os-product-polish-v2
    paths:
      - scripts/patch-os-product-polish-v2.py
      - .github/workflows/apply-os-product-polish-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aizanoi-os-product-polish-v2
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded product polish patch
        run: python3 scripts/patch-os-product-polish-v2.py
      - name: Validate patched sources
        run: |
          node --check frontend/games/game-utils.js
          node --check frontend/js/os-v2.js
          node --check frontend/games/mines.js
          node --check frontend/games/snake.js
          node --check frontend/games/brick.js
          node --test tests/*.test.mjs
          git diff --check
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/patch-os-product-polish-v2.py
          rm .github/workflows/apply-os-product-polish-v2.yml
      - name: Commit product polish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: finish Aizanoi OS single-publisher product polish"
          git push origin HEAD:feat/aizanoi-os-product-polish-v2

# One-shot workflow: the successful patch removes this file from the branch.
