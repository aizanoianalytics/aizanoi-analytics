name: Ancient World Visual Audit Temp

on:
  push:
    branches:
      - fix/ancient-world-visual-parity-v3

permissions:
  contents: read

env:
  CI: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium audit dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/aizanoi-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/aizanoi-http.log
          exit 1
      - name: Capture visual parity audit
        env:
          ANCIENT_WORLD_BASE_URL: http://127.0.0.1:4173
        run: node tests/visual-audit-temp.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ancient-world-visual-audit
          path: artifacts/visual-audit/*.png
          retention-days: 1
