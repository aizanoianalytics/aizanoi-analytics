name: Recruitment feature browser QA

on:
  push:
    branches:
      - feat/recruitment-multiselect-settings

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/recruitment-multiselect-settings
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned browser QA dependencies
        run: |
          npm ci --ignore-scripts --no-fund
          npx playwright install chromium
      - name: Start static frontend server
        run: |
          python3 -m http.server 4173 --directory frontend > /tmp/recruitment-http.log 2>&1 &
          echo $! > /tmp/recruitment-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Exercise Recruitment multi-select and Settings flows
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
          page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`); });

          const url = 'http://127.0.0.1:4173/analytics/dashboards/new-hr-collection/recruitment-analytics/';
          await page.goto(url, { waitUntil: 'domcontentloaded' });
          await page.waitForSelector('[data-multi-filter="unit"] [data-multi-trigger]');
          await page.waitForFunction(() => document.querySelectorAll('[data-settings-dimension="unit"] [data-settings-list="included"] input').length > 2);

          // Excel-like Business Unit multi-select: draft does not apply until Apply.
          const unitTrigger = page.locator('[data-multi-filter="unit"] [data-multi-trigger]');
          const beforeMeta = await page.locator('#datasetMeta').textContent();
          await unitTrigger.click();
          await page.locator('[data-multi-filter="unit"] [data-multi-clear]').click();
          const unitOptions = page.locator('[data-multi-filter="unit"] [data-multi-option]');
          assert.ok(await unitOptions.count() >= 2, 'expected at least two Business Unit options');
          await unitOptions.nth(0).check();
          await unitOptions.nth(1).check();
          assert.equal(await page.locator('#datasetMeta').textContent(), beforeMeta, 'draft selection must not apply before Apply');
          await page.locator('[data-multi-filter="unit"] [data-multi-apply]').click();
          assert.match((await unitTrigger.textContent()) || '', /2 selected/);
          assert.notEqual(await page.locator('#datasetMeta').textContent(), beforeMeta, 'Apply must update analysis scope');

          // Cancel discards a draft change.
          await unitTrigger.click();
          await page.locator('[data-multi-filter="unit"] [data-multi-clear]').click();
          await page.locator('[data-multi-filter="unit"] [data-multi-cancel]').click();
          assert.match((await unitTrigger.textContent()) || '', /2 selected/);

          // Reset top filters, then exclude one Business Unit in Settings.
          await page.locator('#clearGlobalFilters').click();
          await page.locator('[data-view="settings"]').click();
          const includedUnitChecks = page.locator('[data-settings-dimension="unit"] [data-settings-list="included"] input[data-settings-check="included"]');
          const excludedUnitValue = await includedUnitChecks.nth(0).getAttribute('value');
          assert.ok(excludedUnitValue, 'expected a Business Unit value to exclude');
          await includedUnitChecks.nth(0).check();
          await page.locator('[data-settings-dimension="unit"] [data-settings-action="exclude"]').click();
          const excludedUnitRows = page.locator('[data-settings-dimension="unit"] [data-settings-list="excluded"] .settings-option');
          assert.ok(await excludedUnitRows.count() >= 1, 'excluded Business Unit must appear in adjacent Excluded list');

          const stored = await page.evaluate(() => JSON.parse(localStorage.getItem('aizanoi-recruitment-settings-v1')));
          assert.ok(stored.excluded.unit.includes(excludedUnitValue), 'Business Unit exclusion must persist browser-locally');

          // Excluded Business Unit must disappear from the top global filter choices.
          await page.locator('[data-view="dashboard"]').click();
          await unitTrigger.click();
          const visibleUnitValues = await page.locator('[data-multi-filter="unit"] [data-multi-option]').evaluateAll(nodes => nodes.map(n => n.value));
          assert.ok(!visibleUnitValues.includes(excludedUnitValue), 'excluded Business Unit must not remain in global filter choices');
          await page.locator('[data-multi-filter="unit"] [data-multi-cancel]').click();

          // Persistence survives reload; Include selected restores the value.
          await page.reload({ waitUntil: 'domcontentloaded' });
          await page.locator('[data-view="settings"]').click();
          const persistedExcluded = page.locator(`[data-settings-dimension="unit"] [data-settings-list="excluded"] input[value="${CSS.escape(excludedUnitValue)}"]`);
          assert.equal(await persistedExcluded.count(), 1, 'excluded Business Unit must survive reload');
          await persistedExcluded.check();
          await page.locator('[data-settings-dimension="unit"] [data-settings-action="include"]').click();
          assert.equal(await page.locator(`[data-settings-dimension="unit"] [data-settings-list="excluded"] input[value="${CSS.escape(excludedUnitValue)}"]`).count(), 0, 'Include selected must remove value from Excluded');

          // Position Name supports the same Exclude/Include round trip.
          const includedPositionChecks = page.locator('[data-settings-dimension="position_name"] [data-settings-list="included"] input[data-settings-check="included"]');
          assert.ok(await includedPositionChecks.count() > 0, 'expected Position Name options');
          const positionValue = await includedPositionChecks.nth(0).getAttribute('value');
          await includedPositionChecks.nth(0).check();
          await page.locator('[data-settings-dimension="position_name"] [data-settings-action="exclude"]').click();
          const excludedPosition = page.locator(`[data-settings-dimension="position_name"] [data-settings-list="excluded"] input[value="${CSS.escape(positionValue)}"]`);
          assert.equal(await excludedPosition.count(), 1, 'Position Name must move to Excluded');
          await excludedPosition.check();
          await page.locator('[data-settings-dimension="position_name"] [data-settings-action="include"]').click();
          assert.equal(await page.locator(`[data-settings-dimension="position_name"] [data-settings-list="excluded"] input[value="${CSS.escape(positionValue)}"]`).count(), 0, 'Position Name must move back to Included');

          // Narrow-screen Settings uses the stacked layout and does not create page-level horizontal overflow.
          await page.setViewportSize({ width: 390, height: 844 });
          await page.locator('[data-view="settings"]').click();
          const columns = await page.locator('[data-settings-dimension="unit"] .settings-transfer-grid').evaluate(el => getComputedStyle(el).gridTemplateColumns);
          assert.ok(!columns.includes(' '), `expected single-column settings grid on mobile, got ${columns}`);
          const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 1);
          assert.equal(overflow, false, 'Recruitment Settings must not create page-level horizontal overflow');

          assert.deepEqual(errors, [], `browser errors: ${errors.join('\n')}`);
          await browser.close();
          NODE
      - name: Remove temporary QA workflow
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            rm .github/workflows/recruitment-feature-browser-qa.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'chore(recruitment): remove temporary browser QA workflow'
            git push origin HEAD:feat/recruitment-multiselect-settings
          fi
