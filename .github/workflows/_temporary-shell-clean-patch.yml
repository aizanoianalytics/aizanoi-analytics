name: Temporary shell clean patch

on:
  push:
    branches: [perf/shell-startup-yield]

permissions:
  contents: write

jobs:
  clean-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore exact main shell and apply validated minimal patch
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git show FETCH_HEAD:frontend/js/v3/shell.js > frontend/js/v3/shell.js
          python3 - <<'PY'
          from pathlib import Path
          path=Path('frontend/js/v3/shell.js')
          text=path.read_text()
          old="""  root.innerHTML=shellTemplate();\n  renderHome();\n  renderShelf();\n  renderClock();"""
          new="""  root.innerHTML=shellTemplate();\n  renderShelf();\n  renderClock();"""
          if text.count(old)!=1:
              raise SystemExit(f'Expected one legacy boot-home block, found {text.count(old)}')
          text=text.replace(old,new,1)
          old_restore="""  restoreWorkspace().catch((error)=>{\n    console.error('AizanoiOS workspace restoration failed.',error);\n    notify('Workspace restoration failed',error?.message||'Open an app to try again.');\n  });"""
          new_restore="""  requestAnimationFrame(()=>restoreWorkspace().catch((error)=>{\n    console.error('AizanoiOS workspace restoration failed.',error);\n    notify('Workspace restoration failed',error?.message||'Open an app to try again.');\n  }));"""
          if text.count(old_restore)!=1:
              raise SystemExit(f'Expected one workspace restore block, found {text.count(old_restore)}')
          path.write_text(text.replace(old_restore,new_restore,1))
          PY
          git diff --check -- frontend/js/v3/shell.js
      - name: Commit shell patch only
        run: |
          set -euo pipefail
          git add frontend/js/v3/shell.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: apply minimal platform-safe startup patch'
          git push origin HEAD:perf/shell-startup-yield
