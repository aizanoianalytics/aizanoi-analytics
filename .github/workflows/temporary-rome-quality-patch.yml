name: Temporary Rome Quality Patch

on:
  push:
    branches:
      - feat/ancient-world-city-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ancient-world-city-contract
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Rome adaptive quality
        run: python scripts/patch_rome_adaptive_quality.py
      - name: Syntax check Rome app
        run: node --check frontend/ancient-cities/rome-410-476/js/app.js
      - name: Commit exact patch
        run: |
          if git diff --quiet -- frontend/ancient-cities/rome-410-476/js/app.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/ancient-cities/rome-410-476/js/app.js
          git commit -m "feat: add adaptive Rome render quality"
          git push origin HEAD:feat/ancient-world-city-contract
