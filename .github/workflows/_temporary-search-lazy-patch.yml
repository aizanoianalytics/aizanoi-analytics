name: Temporary search lazy patch

on:
  push:
    branches: [feat/global-static-search-v4]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/global-static-search-v4
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Apply exact lazy-search replacements
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {text.count(old)} for {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('frontend/js/v3/registry.js', "import { STATIC_SEARCH_ENTRIES } from './search-index.generated.js';\n", '')
          replace_once('frontend/js/v3/registry.js', 'export function searchableEntries() {', 'export function searchableEntries(extraEntries=[]) {')
          replace_once('frontend/js/v3/registry.js', '    ...STATIC_SEARCH_ENTRIES\n', '    ...extraEntries\n')

          replace_once('frontend/js/v3/shell.js', 'let appsStylePromise = null;\n', "let appsStylePromise = null;\nlet staticSearchEntries = [];\nlet staticSearchPromise = null;\n")
          replace_once('frontend/js/v3/shell.js', "function commandRows(query='') {\n", "function loadStaticSearchEntries() {\n  if (staticSearchPromise) return staticSearchPromise;\n  staticSearchPromise=import('./search-index.generated.js').then(({ STATIC_SEARCH_ENTRIES })=>{\n    staticSearchEntries=STATIC_SEARCH_ENTRIES;\n    return staticSearchEntries;\n  }).catch((error)=>{\n    staticSearchPromise=null;\n    console.warn('Aizanoi static search index failed to load.',error);\n    return staticSearchEntries;\n  });\n  return staticSearchPromise;\n}\n\nfunction commandRows(query='') {\n")
          replace_once('frontend/js/v3/shell.js', '  const entries=searchableEntries().filter(', '  const entries=searchableEntries(staticSearchEntries).filter(')
          replace_once('frontend/js/v3/shell.js', "  renderCommands('');\n  openOverlay('az-command-overlay',opener);\n}", "  renderCommands('');\n  openOverlay('az-command-overlay',opener);\n  loadStaticSearchEntries().then(()=>{\n    if(activeOverlay?.id!=='az-command-overlay')return;\n    renderCommands(document.getElementById('az-command-input')?.value||'');\n  });\n}")

          test = Path('tests/global-static-search.test.mjs')
          text = test.read_text()
          old = "  assert.match(registry,/STATIC_SEARCH_ENTRIES/);\n  assert.match(registry,/\\.\\.\\.STATIC_SEARCH_ENTRIES/);\n"
          new = "  assert.doesNotMatch(registry,/search-index\\.generated\\.js/,'static content index must not join initial registry evaluation');\n  assert.match(registry,/\\.\\.\\.extraEntries/);\n  assert.match(shell,/import\\('\\.\\/search-index\\.generated\\.js'\\)/,'static content index should lazy-load when search opens');\n  assert.match(shell,/searchableEntries\\(staticSearchEntries\\)/);\n"
          if text.count(old) != 1:
              raise SystemExit('global-static-search test contract replacement did not match exactly once')
          test.write_text(text.replace(old,new,1))
          PY
          python /tmp/patch.py
          node --check frontend/js/v3/registry.js
          node --check frontend/js/v3/shell.js
          node --test tests/global-static-search.test.mjs
          git diff --check
      - name: Commit product patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/js/v3/registry.js frontend/js/v3/shell.js tests/global-static-search.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'perf: lazy-load static search content index'
          git push origin HEAD:feat/global-static-search-v4
