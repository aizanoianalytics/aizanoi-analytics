name: HR Rebaseline Once

on:
  push:
    branches:
      - fix/restore-original-hr-pipeline-synthetic-data
    paths:
      - .github/workflows/hr-rebaseline-once.yml

permissions:
  contents: write

jobs:
  rebaseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Install locked HR pipeline dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Rebuild and audit HR Analytics Full Set
        run: bash scripts/regenerate-hr-dashboards.sh
      - name: Commit locked-environment production artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u -- \
            analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar \
            frontend/analytics/dashboards/hr-analytics-full-set

          while IFS= read -r path; do
            case "$path" in
              analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/*.html) ;;
              analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/icmal_sorgu_sonuc.xlsx) ;;
              frontend/analytics/dashboards/hr-analytics-full-set/*.html) ;;
              frontend/analytics/dashboards/hr-analytics-full-set/*/*.html) ;;
              frontend/analytics/dashboards/hr-analytics-full-set/*/*/*.html) ;;
              frontend/analytics/dashboards/hr-analytics-full-set/downloads/hr-analytics-full-set-synthetic-output.xlsx) ;;
              "") ;;
              *) echo "Unexpected tracked HR output: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)

          if git diff --cached --quiet; then
            echo "No tracked HR production artifacts changed."
            exit 0
          fi

          git diff --cached --stat
          git commit -m "build: rebaseline deterministic HR production artifacts"
          git push origin HEAD:fix/restore-original-hr-pipeline-synthetic-data
