name: HR Rebaseline Once

on:
  push:
    branches:
      - fix/restore-original-hr-pipeline-synthetic-data
    paths:
      - .github/workflows/hr-rebaseline-once.yml

permissions:
  contents: write

jobs:
  rebaseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Install locked HR pipeline dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Rebuild and audit HR Analytics Full Set
        run: bash scripts/regenerate-hr-dashboards.sh
      - name: Commit locked-environment production artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/icmal_sorgu_sonuc.xlsx \
            frontend/analytics/dashboards/hr-analytics-full-set

          if git diff --cached --quiet; then
            echo "No HR production artifact changes to commit."
            exit 0
          fi

          git diff --cached --stat
          git commit -m "build: refresh HR artifacts from locked production pipeline"
          git push origin HEAD:fix/restore-original-hr-pipeline-synthetic-data
