name: Temporary Worlds Migration

on:
  push:
    branches: [refactor/unified-worlds-threejs]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '22' }

      - name: Reassemble reviewed v6 payload
        run: |
          set -euo pipefail
          rm -rf /tmp/aizanoi-worlds-migration /tmp/worlds-payload
          mkdir -p /tmp/aizanoi-worlds-migration /tmp/worlds-payload

          cat .migration/v6/worlds/chunk-* > /tmp/aizanoi-worlds-migration/worlds.b64
          base64 -d /tmp/aizanoi-worlds-migration/worlds.b64 > /tmp/aizanoi-worlds-migration/worlds.tar.xz
          printf '%s  %s\n' 'e56096c31f8c0b124e93b11e790b0d5af5190ba7d4a5511132f6b1d63dee6df7' '/tmp/aizanoi-worlds-migration/worlds.tar.xz' | sha256sum -c -
          xz -t /tmp/aizanoi-worlds-migration/worlds.tar.xz
          xz -dc /tmp/aizanoi-worlds-migration/worlds.tar.xz > /tmp/aizanoi-worlds-migration/worlds.tar
          tar -tf /tmp/aizanoi-worlds-migration/worlds.tar >/dev/null
          tar -xf /tmp/aizanoi-worlds-migration/worlds.tar -C /tmp/worlds-payload

          cat .migration/v6/script/chunk-* > /tmp/aizanoi-worlds-migration/script.b64
          base64 -d /tmp/aizanoi-worlds-migration/script.b64 > /tmp/aizanoi-worlds-migration/migrate_worlds.py.xz
          xz -t /tmp/aizanoi-worlds-migration/migrate_worlds.py.xz
          xz -dc /tmp/aizanoi-worlds-migration/migrate_worlds.py.xz > /tmp/aizanoi-worlds-migration/migrate_worlds.py
          printf '%s  %s\n' '2e72ffcbd338590c2780c84c07e24bfbb7bd645d9ef0823c9932fdece8bb037f' '/tmp/aizanoi-worlds-migration/migrate_worlds.py' | sha256sum -c -
          python -m py_compile /tmp/aizanoi-worlds-migration/migrate_worlds.py

      - name: Apply unified Worlds migration
        env:
          THREE_BUILD_DIR: /tmp/three/package/build
        run: |
          set -euo pipefail
          mkdir -p /tmp/three
          npm pack three@0.174.0 --ignore-scripts --pack-destination /tmp/three >/tmp/three-pack.log
          tar -xzf /tmp/three/three-0.174.0.tgz -C /tmp/three
          python /tmp/aizanoi-worlds-migration/migrate_worlds.py

          # Retire the last implementation-specific test that imports the deleted
          # blocky legacy engine. Its coverage is superseded by unified-worlds.test.mjs.
          rm -f tests/modular-flat-world.test.mjs

          # Keep the repository topology contract stable while documenting the new
          # canonical ownership map. Legacy paths now own redirects only.
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/index.md')
          text = path.read_text()
          heading = '## Historical Worlds naming map'
          if heading not in text:
              block = '''\n## Historical Worlds naming map\n\nHistorical Worlds now has one canonical static runtime family:\n\n- `worlds/` — public portal and canonical world routes;\n- `worlds/shared/` — shared Three.js r174 engine, assets, styles and local vendor files;\n- `worlds/aizanoi-225/` — Aizanoi · AD 225;\n- `worlds/rome-410-476/` — Rome · AD 410–476;\n- `worlds/athens-450-430/` — Athens · 450–430 BCE;\n- `worlds/iga-airport/` — Istanbul Airport / İGA present-day spatial study.\n\n`historic-world/`, `ancient-cities/` and `iga/` are compatibility redirects only. The retired `ancient-world/` shared runtime is not a production owner. Research and source methodology remain under `../research/`, separate from browser runtime code.\n'''
              marker = '\n## Boundary\n'
              if marker in text:
                  text = text.replace(marker, block + marker, 1)
              else:
                  text = text.rstrip() + block + '\n'
              path.write_text(text)
          PY

          rm -rf .migration .vendor-cache .worlds-migration

      - name: Validate migrated source contracts
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find frontend/worlds -type f -name '*.js' -print0)
          node scripts/modules/build-module-registry.mjs --check
          node scripts/news/build-news.mjs
          node --test tests/*.test.mjs
          git diff --check

      - name: Commit migration
        run: |
          set -euo pipefail
          # The Actions token intentionally has no workflows permission. Keep every
          # workflow byte-identical in this bot push; workflow changes are committed
          # separately through the authenticated GitHub connector after migration.
          git checkout HEAD -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(worlds): replace legacy ancient-cities and iga with unified zero-dependency 3d engine'
          git push origin HEAD:refactor/unified-worlds-threejs
