name: Temporary Worlds Migration

on:
  push:
    branches: [never/worlds-staging]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '22' }
      - name: Reassemble and unpack reviewed migration payload
        run: |
          set -euo pipefail
          rm -rf /tmp/aizanoi-worlds-migration /tmp/worlds-payload
          mkdir -p /tmp/aizanoi-worlds-migration /tmp/worlds-payload
          cat .migration/parts/worlds.bundle.b64.part-* > /tmp/aizanoi-worlds-migration/worlds.bundle.b64
          base64 -d /tmp/aizanoi-worlds-migration/worlds.bundle.b64 > /tmp/aizanoi-worlds-migration/bundle.tar.gz
          printf '%s  %s\n' 'beeae399ad8c5f9f23ae23ef5c3163d191afb1318c995b853ab63d7b30da680b' '/tmp/aizanoi-worlds-migration/bundle.tar.gz' | sha256sum -c -
          tar -tzf /tmp/aizanoi-worlds-migration/bundle.tar.gz >/dev/null
          tar -xzf /tmp/aizanoi-worlds-migration/bundle.tar.gz -C /tmp/aizanoi-worlds-migration
          worlds_archive="$(find /tmp/aizanoi-worlds-migration -type f -name 'worlds_no_vendor.tar.gz' -print -quit)"
          migration_script="$(find /tmp/aizanoi-worlds-migration -type f -name 'migrate_worlds.py' -print -quit)"
          test -n "$worlds_archive"
          test -n "$migration_script"
          tar -tzf "$worlds_archive" >/dev/null
          tar -xzf "$worlds_archive" -C /tmp/worlds-payload
          cp "$migration_script" /tmp/aizanoi-worlds-migration/migrate_worlds.py
      - name: Apply unified Worlds migration
        env:
          THREE_BUILD_DIR: /tmp/three/package/build
        run: |
          set -euo pipefail
          mkdir -p /tmp/three
          npm pack three@0.174.0 --ignore-scripts --pack-destination /tmp/three >/tmp/three-pack.log
          tar -xzf /tmp/three/three-0.174.0.tgz -C /tmp/three
          python /tmp/aizanoi-worlds-migration/migrate_worlds.py
          rm -rf .migration .vendor-cache .worlds-migration .github/workflows/vendor-worlds-temp.yml
      - name: Validate migrated source contracts
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find frontend/worlds -type f -name '*.js' -print0)
          node scripts/modules/build-module-registry.mjs --check
          node scripts/news/build-news.mjs
          node --test tests/*.test.mjs
          git diff --check
      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(worlds): replace legacy ancient-cities and iga with unified zero-dependency 3d engine'
          git push origin HEAD:refactor/unified-worlds-threejs
