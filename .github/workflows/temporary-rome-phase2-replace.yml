name: Temporary Rome Phase 2 Replace

on:
  push:
    branches:
      - feat/rome-world-rebuild

permissions:
  contents: write

jobs:
  replace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rome-world-rebuild
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Replace Rome app with reviewed Phase 2 build
        run: python scripts/replace_rome_phase2.py

      - name: Syntax check replaced Rome app
        run: node --check frontend/ancient-cities/rome-410-476/js/app.js

      - name: Commit reviewed replacement
        run: |
          if git diff --quiet -- frontend/ancient-cities/rome-410-476/js/app.js; then
            echo "No replacement needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/ancient-cities/rome-410-476/js/app.js
          git commit -m "feat: rebuild Rome terrain, urban fabric and evidence"
          git push origin HEAD:feat/rome-world-rebuild
