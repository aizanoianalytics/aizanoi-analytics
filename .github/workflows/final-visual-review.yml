name: Final Aizanoi Visual Review

on:
  pull_request:
    branches:
      - main
    paths:
      - tests/final-visual-capture.mjs
      - .github/workflows/final-visual-review.yml

permissions:
  contents: read

jobs:
  capture:
    if: github.head_ref == 'feat/final-polish-aaa-2026-08-18'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-polish-aaa-2026-08-18
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium capture dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start static frontend server
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/aizanoi-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/aizanoi-http.log
          exit 1
      - name: Capture OS and Ancient World baselines
        env:
          ANCIENT_WORLD_BASE_URL: http://127.0.0.1:4173
        run: node tests/final-visual-capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: final-aizanoi-visual-review
          path: artifacts/final-visual-review/*.png
          retention-days: 1
