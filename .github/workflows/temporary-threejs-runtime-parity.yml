name: Temporary Three.js Runtime Parity

on:
  push:
    branches:
      - exp/threejs-rome-renderer-poc

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/threejs-rome-renderer-poc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded parity patch
        run: python scripts/patch_threejs_runtime_parity.py
      - name: Validate syntax
        run: |
          node --check experiments/threejs-rome-renderer/src/main.js
          node --check experiments/threejs-rome-renderer/src/runtime-controls.js
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No patch changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/threejs-rome-renderer/src/main.js
          git commit -m 'exp: add lifecycle teleport and mobile parity to Three.js PoC'
          git push
