name: HR Determinism Fix Once

on:
  push:
    branches:
      - fix/restore-original-hr-pipeline-synthetic-data
    paths:
      - .github/workflows/hr-determinism-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Replace wall-clock dependencies with data snapshot time
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('analytics/dashboards/hr-analytics-full-set/production-pipeline/hr_data_pipeline.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '    target_year = int(target_year or pd.Timestamp.now().year)\n',
              '    if target_year is None:\n'
              '        latest_year = pd.to_datetime(df_ts["donem"], errors="coerce").dt.year.max()\n'
              '        if pd.isna(latest_year):\n'
              '            return pd.DataFrame(columns=columns)\n'
              '        target_year = int(latest_year)\n'
              '    else:\n'
              '        target_year = int(target_year)\n',
              'forecast target year',
          )

          replace_once(
              '    active_now = pd.Timestamp.now()\n',
              '    snapshot_dates = (\n'
              '        parse_mixed_date(takip_tablosu["donem"], dayfirst=True)\n'
              '        if "donem" in takip_tablosu.columns\n'
              '        else pd.Series(dtype="datetime64[ns]")\n'
              '    )\n'
              '    active_now = snapshot_dates.max() if not snapshot_dates.empty else pd.NaT\n'
              '    if pd.isna(active_now):\n'
              '        active_now = pd.to_datetime(giris_calc_dt, errors="coerce").max()\n'
              '    if pd.isna(active_now):\n'
              '        active_now = pd.Timestamp("1970-01-01")\n'
              '    active_now = pd.Timestamp(active_now) + pd.offsets.MonthEnd(0)\n',
              'active tenure reference',
          )

          replace_once(
              '        current_year = int(pd.Timestamp.now().year)\n',
              '        latest_observed_period = pd.to_datetime(genel_turnover.get("donem"), errors="coerce").max()\n'
              '        current_year = int(latest_observed_period.year) if pd.notna(latest_observed_period) else None\n',
              'annual backtest year',
          )

          replace_once(
              '    if turnover_tahmin_3ay is not None and not turnover_tahmin_3ay.empty:\n'
              '        tahmin_detay_rows = []\n'
              '        current_time = pd.Timestamp.now().strftime("%Y-%m-%d %H:%M")\n',
              '    if turnover_tahmin_3ay is not None and not turnover_tahmin_3ay.empty:\n'
              '        tahmin_detay_rows = []\n'
              '        forecast_as_of = pd.to_datetime(latest_donem, errors="coerce")\n'
              '        if pd.isna(forecast_as_of) and not genel_turnover.empty:\n'
              '            forecast_as_of = pd.to_datetime(genel_turnover["donem"], errors="coerce").max()\n'
              '        if pd.isna(forecast_as_of):\n'
              '            forecast_as_of = pd.to_datetime(turnover_tahmin_3ay["donem"], errors="coerce").min() - pd.offsets.MonthBegin(1)\n'
              '        current_time = (pd.Timestamp(forecast_as_of) + pd.offsets.MonthEnd(0)).strftime("%Y-%m-%d %H:%M")\n',
              'forecast detail timestamp',
          )

          replace_once(
              '            if not tahmin_aylar.empty:\n'
              '                tahmin_rows = []\n'
              '                current_time = pd.Timestamp.now().strftime("%Y-%m-%d %H:%M")\n',
              '            if not tahmin_aylar.empty:\n'
              '                tahmin_rows = []\n'
              '                current_time = (pd.Timestamp(son_gercek_tarih) + pd.offsets.MonthEnd(0)).strftime("%Y-%m-%d %H:%M")\n',
              'forecast-only timestamp',
          )

          replace_once(
              '    if bugun_tarihi is None:\n'
              '        bugun_tarihi = datetime.now()\n',
              '    if bugun_tarihi is None:\n'
              '        reference_dates = (\n'
              '            parse_mixed_date(satis_akademisi_takip_tablosu["donem"], dayfirst=True)\n'
              '            if "donem" in satis_akademisi_takip_tablosu.columns\n'
              '            else pd.Series(dtype="datetime64[ns]")\n'
              '        )\n'
              '        reference_date = reference_dates.max() if not reference_dates.empty else pd.NaT\n'
              '        if pd.isna(reference_date):\n'
              '            return None\n'
              '        bugun_tarihi = (pd.Timestamp(reference_date) + pd.offsets.MonthEnd(0)).to_pydatetime()\n',
              'training recency reference',
          )

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile analytics/dashboards/hr-analytics-full-set/production-pipeline/hr_data_pipeline.py
          if grep -n 'pd.Timestamp.now()' analytics/dashboards/hr-analytics-full-set/production-pipeline/hr_data_pipeline.py; then
            echo 'Tracked workbook pipeline still contains pd.Timestamp.now()' >&2
            exit 1
          fi
          git diff --check
      - name: Commit deterministic-time fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/dashboards/hr-analytics-full-set/production-pipeline/hr_data_pipeline.py
          git diff --cached --stat
          git commit -m "fix: make HR workbook time references deterministic"
          git push origin HEAD:fix/restore-original-hr-pipeline-synthetic-data
