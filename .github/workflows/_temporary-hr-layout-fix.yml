name: Temporary HR Layout Fix

on:
  push:
    branches:
      - feat/hr-dashboard-english-only-v3
    paths:
      - .github/workflows/_temporary-hr-layout-fix.yml
      - scripts/hr/_temporary_patch_hr_english_layout.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply patch
        run: python scripts/hr/_temporary_patch_hr_english_layout.py
      - name: Commit patch
        run: |
          set -euo pipefail
          git add scripts/hr/decorate-public-dashboard.mjs frontend/analytics/dashboards/hr-analytics-full-set/hr-public-en-visible.js tests/hr-analytics-browser-qa.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(hr): keep English Corporate Goals layout within viewport'
          git push origin HEAD:feat/hr-dashboard-english-only-v3
