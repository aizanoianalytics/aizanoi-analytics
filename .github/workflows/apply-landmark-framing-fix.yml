name: Apply Landmark Framing Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-landmark-framing-fix-2026-08-18.py
      - .github/workflows/apply-landmark-framing-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/final-polish-aaa-2026-08-18'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-polish-aaa-2026-08-18
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded landmark framing fix
        run: python3 scripts/apply-landmark-framing-fix-2026-08-18.py
      - name: Validate product code and regression tests
        run: |
          node --check frontend/ancient-world/engine/landmark-framing.js
          node --check frontend/ancient-cities/rome-410-476/js/app.js
          node --check frontend/ancient-cities/athens-450-430/js/app.js
          node --test tests/*.test.mjs
          git diff --check
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply-landmark-framing-fix-2026-08-18.py
          rm .github/workflows/apply-landmark-framing-fix.yml
      - name: Commit final framing changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: frame Ancient World landmarks cinematically"
          git push origin HEAD:feat/final-polish-aaa-2026-08-18
