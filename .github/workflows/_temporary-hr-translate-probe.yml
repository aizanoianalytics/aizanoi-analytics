name: Temporary HR Translate Probe

on:
  push:
    branches:
      - feat/hr-dashboard-english-only-v3

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          npm ci --ignore-scripts
          npx playwright install chromium
      - shell: bash
        run: |
          set -euo pipefail
          root=frontend/analytics/dashboards/hr-analytics-full-set
          files=(
            "$root/corporate-goals/index.html"
            "$root/hr-administration-deep-dive/index.html"
            "$root/hr-executive-board-current/index.html"
            "$root/hr-executive-board-full-history/index.html"
            "$root/learning-academy-analytics/index.html"
            "$root/performance-hiring-turnover/index.html"
            "$root/store-learning-compliance/index.html"
            "$root/store-operations-tracking/index.html"
            "$root/workforce-time-attendance/index.html"
            "$root/workforce-turnover/index.html"
          )
          node scripts/hr/decorate-public-dashboard.mjs "${files[@]}"
          node scripts/hr/localize-public-dashboard-en.mjs "${files[@]}"
          python3 -m http.server 4173 --directory frontend >/tmp/hr-probe.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/analytics/dashboards/hr-analytics-full-set/ >/dev/null && break; sleep 1; done
      run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const cases = [
            ['hr-executive-board-current','Çalışan Sayısı (Yıllara Göre + 12 Ay Detay)'],
            ['learning-academy-analytics','Kritik Aksiyon'],
            ['store-learning-compliance','Akademi Açığı'],
            ['workforce-turnover','Önceki Aya Göre'],
            ['hr-administration-deep-dive','Veri Eksik'],
          ];
          const browser=await chromium.launch({headless:true});
          for(const [route,sample] of cases){
            const page=await browser.newPage();
            await page.goto(`http://127.0.0.1:4173/analytics/dashboards/hr-analytics-full-set/${route}/`,{waitUntil:'networkidle'});
            await page.waitForTimeout(500);
            const result=await page.evaluate((sample)=>{
              const translate=globalThis.AizanoiHrEnglish?.translate;
              const nodes=[];
              const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
              let node;
              while((node=walker.nextNode())){
                if(String(node.nodeValue??'').replace(/\s+/g,' ').trim()===sample){
                  const el=node.parentElement;
                  nodes.push({tag:el?.tagName,id:el?.id||'',className:typeof el?.className==='string'?el.className:'',skip:Boolean(el?.closest('script,style,noscript,template,textarea')),connected:node.isConnected});
                }
              }
              return {sample,translated:typeof translate==='function'?translate(sample):null,runtime:typeof translate,nodes};
            },sample);
            console.log(JSON.stringify({route,...result}));
            await page.close();
          }
          await browser.close();
          NODE
