name: Temporary HR Translate Probe

on:
  push:
    branches:
      - feat/hr-dashboard-english-only-v3

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install browser
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Build and serve candidate
        shell: bash
        run: |
          set -euo pipefail
          root=frontend/analytics/dashboards/hr-analytics-full-set
          files=(
            "$root/corporate-goals/index.html"
            "$root/hr-administration-deep-dive/index.html"
            "$root/hr-executive-board-current/index.html"
            "$root/hr-executive-board-full-history/index.html"
            "$root/learning-academy-analytics/index.html"
            "$root/performance-hiring-turnover/index.html"
            "$root/store-learning-compliance/index.html"
            "$root/store-operations-tracking/index.html"
            "$root/workforce-time-attendance/index.html"
            "$root/workforce-turnover/index.html"
          )
          node scripts/hr/decorate-public-dashboard.mjs "${files[@]}"
          node scripts/hr/localize-public-dashboard-en.mjs "${files[@]}"
          python3 -m http.server 4173 --directory frontend >/tmp/hr-probe.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/analytics/dashboards/hr-analytics-full-set/ >/dev/null && break; sleep 1; done
      - name: Trace only final residuals
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const wanted = value => /PDKS satırı| veya Synthetic Employee| saat \/ .* saat/u.test(String(value ?? ''));
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
          await page.addInitScript(() => {
            globalThis.__canvas = [];
            const proto = globalThis.CanvasRenderingContext2D?.prototype;
            if (!proto) return;
            for (const name of ['fillText', 'strokeText']) {
              const original = proto[name];
              if (typeof original !== 'function') continue;
              proto[name] = function(text, ...args) {
                if (/PDKS satırı| veya Synthetic Employee| saat \/ .* saat/u.test(String(text ?? ''))) {
                  globalThis.__canvas.push({ method: name, text: String(text) });
                }
                return original.call(this, text, ...args);
              };
            }
          });
          await page.goto('http://127.0.0.1:4173/analytics/dashboards/hr-analytics-full-set/workforce-time-attendance/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(700);
          const out = await page.evaluate(() => {
            const text = [];
            const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
            let node;
            while ((node = walker.nextNode())) {
              const value = String(node.nodeValue ?? '').replace(/\s+/g, ' ').trim();
              if (!/PDKS satırı| veya Synthetic Employee| saat \/ .* saat/u.test(value)) continue;
              const el = node.parentElement;
              text.push({ value, tag: el?.tagName || '', id: el?.id || '', className: typeof el?.className === 'string' ? el.className : '', skipped: Boolean(el?.closest('script,style,noscript,template,textarea')) });
            }
            const attrs = [];
            for (const el of document.querySelectorAll('[aria-label],[title],[placeholder],[alt],[data-label],[data-title]')) {
              for (const name of ['aria-label','title','placeholder','alt','data-label','data-title']) {
                if (!el.hasAttribute(name)) continue;
                const value = el.getAttribute(name) || '';
                if (/PDKS satırı| veya Synthetic Employee| saat \/ .* saat/u.test(value)) attrs.push({ name, value, tag: el.tagName, id: el.id || '' });
              }
            }
            const samples = [
              '1, 375 PDKS satırı · 11 unique employee IDs · January 2026, February 2026, March 2026, April 2026, May 2026, June 2026, July 2026, August 2026',
              'e.g. 99000007 veya Synthetic Employee 0007',
              'January 2026: 1,600.8 saat / 1,589.5 saat'
            ];
            return {
              text,
              attrs,
              canvas: globalThis.__canvas || [],
              translations: samples.map(sample => ({
                sample,
                base: globalThis.AizanoiHrEnglish?.translate?.(sample) ?? null,
                visible: globalThis.AizanoiHrEnglishVisible?.translate?.(sample) ?? null,
              })),
              baseType: typeof globalThis.AizanoiHrEnglish?.translate,
              visibleType: typeof globalThis.AizanoiHrEnglishVisible?.translate,
            };
          });
          console.log(JSON.stringify(out));
          await browser.close();
          NODE
