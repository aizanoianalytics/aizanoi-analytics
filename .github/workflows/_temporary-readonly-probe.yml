name: Temporary HR Historical Date Commit
on:
  push:
    branches: [fix/hr-synthetic-historical-dates]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/hr-synthetic-historical-dates
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Install locked HR dependencies
        run: python -m pip install --disable-pip-version-check -r analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Apply validated source and synthetic-input fix
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          import openpyxl

          root=Path('analytics/dashboards/hr-analytics-full-set/production-pipeline')
          generator=Path('analytics/dashboards/hr-analytics-full-set/tools/generate_synthetic_source_workbooks.mjs')
          s=generator.read_text(encoding='utf-8')
          changes=[
            ('const monthEnd = new Date(Date.UTC(2026, 7, 1));\n', 'const monthEnd = new Date(Date.UTC(2026, 7, 1));\nconst reportingDate = new Date(Date.UTC(monthEnd.getUTCFullYear(), monthEnd.getUTCMonth() + 1, 0));\n'),
            ('function seeded(index, salt = 0) {\n  const x = Math.sin((index + 1) * 12.9898 + salt * 78.233) * 43758.5453;\n  return x - Math.floor(x);\n}\n', 'function seeded(index, salt = 0) {\n  const x = Math.sin((index + 1) * 12.9898 + salt * 78.233) * 43758.5453;\n  return x - Math.floor(x);\n}\n\nfunction historicalDate(year, month, dayValue = 1) {\n  const candidate = new Date(Date.UTC(year, month, dayValue));\n  if (candidate <= reportingDate) return candidate;\n  return new Date(Date.UTC(year - 1, month, dayValue));\n}\n'),
            ('  const exit = exits ? addMonths(new Date(Date.UTC(2023 + (index % 4), (index * 3) % 12, 15)), 0) : null;', '  const exitCandidate = exits ? addMonths(new Date(Date.UTC(2023 + (index % 4), (index * 3) % 12, 15)), 0) : null;\n  const exit = exitCandidate && exitCandidate <= reportingDate ? exitCandidate : null;'),
            ('const performanceRows = activeEmployees.flatMap((employee, index) => [2025, 2026].map((year) => { const score = 65 + Math.round(seeded(index, year) * 32); return [new Date(Date.UTC(year, 11, 1)), employee.id, employee.name, score, Math.min(120, score * 1.2), score + 2, score * 0.25, (score + 2) * 0.75, score >= 90 ? "A" : score >= 75 ? "B" : "C", score >= 75 ? "Successful" : "Development", "Synthetic performance assessment"]; }));', 'const performancePeriods = [new Date(Date.UTC(2025, 11, 1)), new Date(Date.UTC(2026, monthEnd.getUTCMonth(), 1))];\nconst performanceRows = activeEmployees.flatMap((employee, index) => performancePeriods.map((period) => { const year = period.getUTCFullYear(); const score = 65 + Math.round(seeded(index, year) * 32); return [period, employee.id, employee.name, score, Math.min(120, score * 1.2), score + 2, score * 0.25, (score + 2) * 0.75, score >= 90 ? "A" : score >= 75 ? "B" : "C", score >= 75 ? "Successful" : "Development", "Synthetic performance assessment"]; }));'),
            ('const disciplineRows = employees.filter((_, index) => index % 8 === 0).map((employee, index) => [employee.id, ["C001", "C002", "C010", "C019"][index % 4], new Date(Date.UTC(2025 + (index % 2), index % 12, 5 + (index % 20))), "Synthetic policy record"]);', 'const disciplineRows = employees.filter((_, index) => index % 8 === 0).map((employee, index) => [employee.id, ["C001", "C002", "C010", "C019"][index % 4], historicalDate(2025 + (index % 2), index % 12, 5 + (index % 20)), "Synthetic policy record"]);')
          ]
          for old,new in changes:
            if old not in s: raise SystemExit(f'missing expected generator fragment: {old[:90]}')
            s=s.replace(old,new,1)
          generator.write_text(s,encoding='utf-8')

          limit=datetime(2026,8,31)
          book=root/'cezalar.xlsx'; wb=openpyxl.load_workbook(book); ws=wb['sheet_1']; h=[c.value for c in ws[1]]; col=h.index('TARIH')+1
          for row in range(2,ws.max_row+1):
            value=ws.cell(row,col).value
            if isinstance(value,datetime) and value>limit: ws.cell(row,col).value=value.replace(year=value.year-1)
          wb.save(book)

          leavers=root/'Ayrilanlar_Listesi.xlsx'; wb=openpyxl.load_workbook(leavers); ws=wb['Sayfa1']; h=[c.value for c in ws[1]]; id_col=h.index('Sicil No')+1; exit_col=h.index('Çıkış Tarihi')+1; future_ids=set()
          for row in range(ws.max_row,1,-1):
            value=ws.cell(row,exit_col).value
            if isinstance(value,datetime) and value>limit:
              future_ids.add(str(ws.cell(row,id_col).value).split('.')[0]); ws.delete_rows(row,1)
          if len(future_ids)!=4: raise SystemExit(f'expected 4 future synthetic leavers, got {sorted(future_ids)}')
          wb.save(leavers)
          for filename,sheet,id_name,exit_name,delete_rows in [
            ('cikis_sebepleri.xlsx','Sheet1','Sicil','Çıkış Tarihi',True),
            ('eski_kaynak.xlsx','Sayfa1','sicil','cikis_tarihi',False),
            ('ise_alma_suresi.xlsx','Sayfa1','Sicil No','Çıkış Tarihi',False),
          ]:
            path=root/filename; wb=openpyxl.load_workbook(path); ws=wb[sheet]; h=[c.value for c in ws[1]]; id_col=h.index(id_name)+1; exit_col=h.index(exit_name)+1
            for row in range(ws.max_row,1,-1):
              if str(ws.cell(row,id_col).value).split('.')[0] in future_ids:
                if delete_rows: ws.delete_rows(row,1)
                else: ws.cell(row,exit_col).value=None
            wb.save(path)

          perf=root/'performans_magaza_verileri.xlsx'; wb=openpyxl.load_workbook(perf); ws=wb['Sheet1']; h=[c.value for c in ws[1]]; col=h.index('donem')+1; changed=0
          for row in range(2,ws.max_row+1):
            value=ws.cell(row,col).value
            if isinstance(value,datetime) and value>limit:
              ws.cell(row,col).value=datetime(2026,8,1); changed+=1
          if not changed: raise SystemExit('expected future completed performance periods')
          wb.save(perf)
          PY
      - name: Add permanent historical-event regression verifier
        run: |
          cat > scripts/verify-hr-historical-event-dates.py <<'PY'
          #!/usr/bin/env python3
          """Reject synthetic historical HR events dated after the reporting reference date."""
          from datetime import datetime
          from pathlib import Path
          import re
          import openpyxl

          REPO = Path(__file__).resolve().parents[1]
          ROOT = REPO / 'analytics/dashboards/hr-analytics-full-set/production-pipeline'
          PUBLIC = REPO / 'frontend/analytics/dashboards/hr-analytics-full-set'
          LIMIT = datetime(2026, 8, 31)
          CHECKS = (
              ('cezalar.xlsx', 'sheet_1', 'TARIH'),
              ('Ayrilanlar_Listesi.xlsx', 'Sayfa1', 'Çıkış Tarihi'),
              ('cikis_sebepleri.xlsx', 'Sheet1', 'Çıkış Tarihi'),
              ('performans_magaza_verileri.xlsx', 'Sheet1', 'donem'),
              ('ise_alma_suresi.xlsx', 'Sayfa1', 'İşe Giriş Tarihi'),
          )

          for filename, sheet, column in CHECKS:
              workbook = openpyxl.load_workbook(ROOT / filename, data_only=True, read_only=True)
              worksheet = workbook[sheet]
              rows = worksheet.iter_rows(values_only=True)
              headers = list(next(rows))
              index = headers.index(column)
              future = [row[index] for row in rows if isinstance(row[index], datetime) and row[index] > LIMIT]
              if future:
                  raise SystemExit(f'{filename}:{column} contains future historical events: {future[:5]}')

          symptom = re.compile(r'(?:ceza|disciplin)[^<]{0,180}-\d+\s*(?:day|gün)', re.I)
          for page in PUBLIC.glob('*/index.html'):
              if symptom.search(page.read_text(encoding='utf-8')):
                  raise SystemExit(f'negative days-since-discipline symptom in {page}')
          print('HR synthetic historical-event dates: OK')
          PY
          chmod +x scripts/verify-hr-historical-event-dates.py
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/regenerate-hr-dashboards.sh')
          s=p.read_text(encoding='utf-8')
          old='echo "[4/4] running HR audit contracts"\nnode --test \\\n'
          new='echo "[4/4] running HR audit contracts"\npython3 scripts/verify-hr-historical-event-dates.py\nnode --test \\\n'
          if old not in s: raise SystemExit('HR audit insertion point missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Rebuild, verify determinism, and commit exact generated outputs
        run: |
          set -euo pipefail
          bash scripts/regenerate-hr-dashboards.sh
          cp analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/icmal_sorgu_sonuc.xlsx /tmp/hr-first.xlsx
          bash scripts/regenerate-hr-dashboards.sh
          python scripts/verify-hr-workbook-semantics.py /tmp/hr-first.xlsx analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/icmal_sorgu_sonuc.xlsx
          python scripts/verify-hr-historical-event-dates.py
          git rm .github/workflows/_temporary-readonly-probe.yml
          rm -rf artifacts
          git add analytics/dashboards/hr-analytics-full-set frontend/analytics/dashboards/hr-analytics-full-set scripts/regenerate-hr-dashboards.sh scripts/verify-hr-historical-event-dates.py
          git diff --cached --check
          git config user.name 'aizanoi-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(hr): bound synthetic historical events to reporting date'
          git push origin HEAD:fix/hr-synthetic-historical-dates
