name: Temporary Readonly HR Date Rebuild
on:
  push:
    branches: [fix/hr-synthetic-historical-dates]
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Install locked HR dependencies
        run: python -m pip install --disable-pip-version-check -r analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Apply candidate generator fix and synchronize committed discipline input
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          import openpyxl

          generator=Path('analytics/dashboards/hr-analytics-full-set/tools/generate_synthetic_source_workbooks.mjs')
          s=generator.read_text(encoding='utf-8')
          changes=[
            ('const monthEnd = new Date(Date.UTC(2026, 7, 1));\n', 'const monthEnd = new Date(Date.UTC(2026, 7, 1));\nconst reportingDate = new Date(Date.UTC(monthEnd.getUTCFullYear(), monthEnd.getUTCMonth() + 1, 0));\n'),
            ('function seeded(index, salt = 0) {\n  const x = Math.sin((index + 1) * 12.9898 + salt * 78.233) * 43758.5453;\n  return x - Math.floor(x);\n}\n', 'function seeded(index, salt = 0) {\n  const x = Math.sin((index + 1) * 12.9898 + salt * 78.233) * 43758.5453;\n  return x - Math.floor(x);\n}\n\nfunction historicalDate(year, month, dayValue = 1) {\n  const candidate = new Date(Date.UTC(year, month, dayValue));\n  if (candidate <= reportingDate) return candidate;\n  return new Date(Date.UTC(year - 1, month, dayValue));\n}\n'),
            ('const disciplineRows = employees.filter((_, index) => index % 8 === 0).map((employee, index) => [employee.id, ["C001", "C002", "C010", "C019"][index % 4], new Date(Date.UTC(2025 + (index % 2), index % 12, 5 + (index % 20))), "Synthetic policy record"]);', 'const disciplineRows = employees.filter((_, index) => index % 8 === 0).map((employee, index) => [employee.id, ["C001", "C002", "C010", "C019"][index % 4], historicalDate(2025 + (index % 2), index % 12, 5 + (index % 20)), "Synthetic policy record"]);')
          ]
          for old,new in changes:
            if old not in s: raise SystemExit(f'missing expected source fragment: {old[:80]}')
            s=s.replace(old,new,1)
          generator.write_text(s,encoding='utf-8')

          book=Path('analytics/dashboards/hr-analytics-full-set/production-pipeline/cezalar.xlsx')
          wb=openpyxl.load_workbook(book)
          ws=wb['sheet_1']
          headers=[cell.value for cell in ws[1]]
          date_col=headers.index('TARIH')+1
          limit=datetime(2026,8,31)
          changed=[]
          for row in range(2,ws.max_row+1):
            value=ws.cell(row,date_col).value
            if isinstance(value,datetime) and value>limit:
              replacement=value.replace(year=value.year-1)
              ws.cell(row,date_col).value=replacement
              changed.append((row,value.date().isoformat(),replacement.date().isoformat()))
          if not changed: raise SystemExit('expected at least one future discipline date to repair')
          wb.save(book)
          print('discipline dates repaired:',changed)
          PY
      - name: Rebuild canonical HR outputs and verify date contract
        run: |
          set -euo pipefail
          mkdir -p artifacts/hr-date
          bash scripts/regenerate-hr-dashboards.sh
          cp analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/icmal_sorgu_sonuc.xlsx /tmp/hr-first.xlsx
          bash scripts/regenerate-hr-dashboards.sh
          python scripts/verify-hr-workbook-semantics.py /tmp/hr-first.xlsx analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/icmal_sorgu_sonuc.xlsx
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          import openpyxl,re
          root=Path('analytics/dashboards/hr-analytics-full-set/production-pipeline')
          wb=openpyxl.load_workbook(root/'cezalar.xlsx',data_only=True,read_only=True)
          ws=wb['sheet_1']
          headers=[c.value for c in next(ws.iter_rows(min_row=1,max_row=1))]
          col=headers.index('TARIH')
          limit=datetime(2026,8,31)
          bad=[row[col] for row in ws.iter_rows(min_row=2,values_only=True) if row[col] and row[col]>limit]
          if bad: raise SystemExit(f'future discipline dates remain: {bad}')
          for page in Path('frontend/analytics/dashboards/hr-analytics-full-set').glob('*/index.html'):
            text=page.read_text(encoding='utf-8')
            if re.search(r'(?:ceza|disciplin)[^<]{0,160}-\d+\s*(?:day|gün)',text,re.I):
              raise SystemExit(f'negative discipline age found in {page}')
          print('historical discipline date + negative-age contracts: OK')
          PY
          git diff --binary > artifacts/hr-date/generated.patch
          git status --short > artifacts/hr-date/status.txt
          cp analytics/dashboards/hr-analytics-full-set/tools/generate_synthetic_source_workbooks.mjs artifacts/hr-date/generate_synthetic_source_workbooks.mjs
          cp analytics/dashboards/hr-analytics-full-set/production-pipeline/cezalar.xlsx artifacts/hr-date/cezalar.xlsx
          cp analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/icmal_sorgu_sonuc.xlsx artifacts/hr-date/icmal_sorgu_sonuc.xlsx
          cp frontend/analytics/dashboards/hr-analytics-full-set/downloads/hr-analytics-full-set-synthetic-output.xlsx artifacts/hr-date/hr-analytics-full-set-synthetic-output.xlsx
          find frontend/analytics/dashboards/hr-analytics-full-set -name '*.html' -print0 | tar --null -T - -czf artifacts/hr-date/public-html.tar.gz
      - name: Upload candidate artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hr-date-candidate
          path: artifacts/hr-date/*
          retention-days: 3
