name: Temporary HR Fix Runtime

on:
  push:
    branches:
      - feat/hr-dashboard-english-only-v3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Patch runtime generator safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/hr/localize-public-dashboard-en.mjs')
          text = path.read_text()
          if "from 'node:vm'" not in text:
              text = text.replace("import { readFileSync, writeFileSync } from 'node:fs';\n", "import { readFileSync, writeFileSync } from 'node:fs';\nimport { Script } from 'node:vm';\n", 1)
          start_marker = "    m=value.match(/^Üretim:"
          end_marker = "    const middleDot=value.split(' · ');"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          segment = text[start:end]
          if '\\\\s' not in segment:
              segment = segment.replace('\\', '\\\\')
              text = text[:start] + segment + text[end:]
          validation = "new Script(runtime, { filename: 'hr-public-en.js' });"
          if validation not in text:
              text = text.replace("`;\n\nconst managedTag", "`;\n" + validation + "\n\nconst managedTag", 1)
          path.write_text(text)
          Path('.github/workflows/_temporary-hr-fix-runtime.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/hr/localize-public-dashboard-en.mjs .github/workflows/_temporary-hr-fix-runtime.yml
          git diff --cached --check
          git commit -m "fix(hr): repair English runtime regex generation"
          git push origin HEAD:feat/hr-dashboard-english-only-v3
