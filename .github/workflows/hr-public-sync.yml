name: HR Public Artifact Sync

on:
  push:
    branches: [fix/hr-public-sanitization]
    paths:
      - '.github/workflows/hr-public-sync.yml'

permissions:
  contents: write

jobs:
  sync-generated-html:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/hr-public-sanitization
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Install locked HR pipeline dependencies
        run: python -m pip install --disable-pip-version-check -r analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Regenerate and sanitize public HR dashboards
        run: bash scripts/regenerate-hr-dashboards.sh
      - name: Commit only canonical public HTML artifacts
        run: |
          set -euo pipefail
          find frontend/analytics/dashboards/hr-analytics-full-set -type f -name '*.html' -print0 | xargs -0 git add --
          if git diff --cached --quiet; then
            echo 'No generated public HTML changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync sanitized HR public dashboards'
          git push origin HEAD:fix/hr-public-sanitization
