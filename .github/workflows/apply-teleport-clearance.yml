name: Apply Teleport Clearance Patch

on:
  push:
    branches:
      - fix/ancient-world-visual-parity-v3
    paths:
      - scripts/patch-teleport-clearance.py
      - .github/workflows/apply-teleport-clearance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ancient-world-visual-parity-v3
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded teleport patch
        run: python3 scripts/patch-teleport-clearance.py
      - name: Validate result
        run: |
          node --check frontend/ancient-cities/rome-410-476/js/app.js
          node --check frontend/ancient-cities/athens-450-430/js/app.js
          node --test tests/*.test.mjs
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/patch-teleport-clearance.py
          rm .github/workflows/apply-teleport-clearance.yml
      - name: Commit patched files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: choose walkable Ancient World teleport spawns"
          git push origin HEAD:fix/ancient-world-visual-parity-v3
