name: Patch Athens Hero Cleanup

on:
  push:
    branches:
      - feat/ancient-cities-mobile-visual-v2
    paths:
      - .github/athens-hero-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ancient-cities-mobile-visual-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded patch
        run: python3 .github/scripts/patch_athens_hero_and_cleanup.py
      - name: Validate changed files
        run: |
          node --check frontend/ancient-cities/rome-410-476/js/app.js
          node --check frontend/ancient-cities/athens-450-430/js/app.js
          git diff --check
      - name: Remove one-shot machinery
        run: |
          rm -f .github/athens-hero-trigger
          git rm .github/scripts/patch_athens_hero_and_cleanup.py
          git rm .github/workflows/patch-athens-hero-cleanup.yml
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(athens): strengthen hero architecture and clean legacy touch code"
          git push origin HEAD:feat/ancient-cities-mobile-visual-v2
