name: Apply Landmark Camera Clearance

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/apply-landmark-camera-clearance-2026-08-18.py
      - .github/workflows/apply-landmark-camera-clearance.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/final-polish-aaa-2026-08-18'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-polish-aaa-2026-08-18
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded camera-clearance patch
        run: python3 scripts/apply-landmark-camera-clearance-2026-08-18.py
      - name: Validate source suite
        run: |
          node --check frontend/ancient-world/engine/landmark-framing.js
          node --check frontend/ancient-cities/rome-410-476/js/app.js
          node --check frontend/ancient-cities/athens-450-430/js/app.js
          node --test tests/*.test.mjs
          git diff --check
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Real browser movement and visual gates
        env:
          ANCIENT_WORLD_BASE_URL: http://127.0.0.1:4173
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/aizanoi-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.5; done
          node tests/ancient-city-browser-smoke.mjs
          node tests/final-visual-capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: camera-clearance-review
          path: artifacts/final-visual-review/*.png
          retention-days: 1
      - name: Remove one-shot files and commit product patch
        run: |
          rm scripts/apply-landmark-camera-clearance-2026-08-18.py
          rm .github/workflows/apply-landmark-camera-clearance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend tests
          git diff --cached --check
          git commit -m "fix: keep landmark cameras clear of nearby massing"
          git push origin HEAD:feat/final-polish-aaa-2026-08-18
