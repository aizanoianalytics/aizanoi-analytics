name: Temporary Three.js A/B Capture

on:
  push:
    branches:
      - exp/threejs-rome-renderer-poc

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/threejs-rome-renderer-poc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install experiment dependencies
        working-directory: experiments/threejs-rome-renderer
        run: npm install --ignore-scripts --package-lock=false
      - name: Vendor Three.js
        working-directory: experiments/threejs-rome-renderer
        run: npm run vendor
      - name: Install Chromium
        working-directory: experiments/threejs-rome-renderer
        run: npx playwright install chromium --with-deps
      - name: Capture matched Colosseum baselines
        working-directory: experiments/threejs-rome-renderer
        run: npm run capture:ab
      - name: Commit baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/threejs-rome-renderer/visual-baseline/*.png
          git commit -m 'test: capture Rome renderer Colosseum A/B baseline'
          git push
