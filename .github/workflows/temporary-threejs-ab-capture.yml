name: Temporary Three.js A/B Capture

on:
  push:
    branches:
      - exp/threejs-rome-renderer-poc

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: exp/threejs-rome-renderer-poc
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install experiment dependencies
        working-directory: experiments/threejs-rome-renderer
        run: npm install --ignore-scripts --package-lock=false
      - name: Vendor Three.js
        working-directory: experiments/threejs-rome-renderer
        run: npm run vendor
      - name: Install Chromium
        working-directory: experiments/threejs-rome-renderer
        run: npx playwright install chromium --with-deps
      - name: Capture matched Colosseum baselines
        working-directory: experiments/threejs-rome-renderer
        run: npm run capture:ab
      - name: Upload A/B screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: rome-renderer-ab-baseline
          path: experiments/threejs-rome-renderer/visual-baseline/*.png
          retention-days: 5
      - name: Commit baselines when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/threejs-rome-renderer/visual-baseline/*.png
          if git diff --cached --quiet; then
            echo 'Baseline images unchanged.'
            exit 0
          fi
          git commit -m 'test: refresh Rome renderer Colosseum A/B baseline'
          git push
