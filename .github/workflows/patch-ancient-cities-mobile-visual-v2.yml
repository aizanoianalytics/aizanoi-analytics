name: Patch Ancient Cities Mobile Visual V2

on:
  push:
    branches:
      - feat/ancient-cities-mobile-visual-v2
    paths:
      - .github/ancient-v2-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ancient-cities-mobile-visual-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded patch
        run: python3 .github/scripts/patch_ancient_cities_mobile_visual_v2.py
      - name: Validate changed JavaScript
        run: |
          node --check frontend/ancient-world/engine/mobile-controls.js
          node --check frontend/ancient-cities/rome-410-476/js/app.js
          node --check frontend/ancient-cities/athens-450-430/js/app.js
          git diff --check
      - name: Remove one-shot patch machinery
        run: |
          rm -f .github/ancient-v2-trigger
          git rm .github/scripts/patch_ancient_cities_mobile_visual_v2.py
          git rm .github/workflows/patch-ancient-cities-mobile-visual-v2.yml
      - name: Commit patched product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ancient-cities): unify mobile controls and visual polish"
          git push origin HEAD:feat/ancient-cities-mobile-visual-v2
