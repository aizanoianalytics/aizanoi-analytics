name: Temporary Three.js Evidence Smoke

on:
  push:
    branches:
      - exp/threejs-rome-renderer-poc

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/threejs-rome-renderer-poc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded browser smoke patch
        run: python scripts/patch_threejs_evidence_browser_smoke.py
      - name: Validate syntax
        run: node --check experiments/threejs-rome-renderer/scripts/browser-smoke.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No patch changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/threejs-rome-renderer/scripts/browser-smoke.mjs
          git commit -m 'test: prove evidence survives Three.js renderer teardown'
          git push
