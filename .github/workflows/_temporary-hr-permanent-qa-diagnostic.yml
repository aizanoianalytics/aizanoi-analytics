name: Temporary HR Permanent QA Diagnostic

on:
  push:
    branches:
      - feat/hr-dashboard-english-only-v3
    paths:
      - .github/workflows/_temporary-hr-permanent-qa-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r analytics/dashboards/hr-analytics-full-set/production-pipeline/requirements-dashboard-lock.txt
          npm ci --ignore-scripts --no-fund
          npx playwright install chromium
      - name: Canonical rebuild
        run: bash scripts/regenerate-hr-dashboards.sh >/tmp/hr-rebuild.log 2>&1
      - name: Run permanent QA and print concise failure
        shell: bash
        run: |
          set -uo pipefail
          python3 -m http.server 4173 --directory frontend >/tmp/hr-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/analytics/dashboards/hr-analytics-full-set/ >/dev/null; then break; fi
            sleep 1
          done
          set +e
          ANCIENT_WORLD_BASE_URL=http://127.0.0.1:4173 node tests/hr-analytics-browser-qa.mjs >/tmp/hr-qa.log 2>&1
          status=$?
          set -e
          echo '=== QA concise diagnostic ==='
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/hr-qa.log').read_text(errors='replace').splitlines()
          needles = ('AssertionError','ERR_ASSERTION','residual','console','overflow','pageError','desktop','mobile','lang=', 'actual:', 'expected:', 'operator:', 'route')
          hits=[]
          for i,line in enumerate(lines):
              if any(n.lower() in line.lower() for n in needles):
                  lo=max(0,i-2); hi=min(len(lines),i+5)
                  hits.extend(lines[lo:hi])
          if not hits:
              hits=lines[-80:]
          out=[]
          seen=set()
          for line in hits:
              if line not in seen:
                  seen.add(line); out.append(line)
          print('\n'.join(out[-160:]))
          PY
          echo "QA_EXIT=${status}"
          exit "$status"
