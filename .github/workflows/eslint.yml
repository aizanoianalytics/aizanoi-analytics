name: Aizanoi ESLint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aizanoi-eslint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # Registry slowness can consume most of the old 8-minute budget before
    # the deterministic local ESLint gate starts. The audit subprocess itself
    # remains bounded to 90 seconds by npm-audit-gate.mjs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/eslint/package-lock.json
      - name: Install locked ESLint toolchain
        run: |
          npm ci --prefix tools/eslint --ignore-scripts --no-fund
          node scripts/ci/npm-audit-gate.mjs --prefix tools/eslint
      - name: Enforce bug-class JavaScript rules
        run: ./tools/eslint/node_modules/.bin/eslint -c eslint.config.js frontend/js/v3 frontend/analytics frontend/service-worker.js frontend/web-editor-preview/runner.js scripts tests
