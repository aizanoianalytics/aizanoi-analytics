name: Security Gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'security/**'

permissions:
  contents: read

concurrency:
  group: aizanoi-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1, pinned to immutable commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      # setup-node pinned to an immutable upstream commit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Security-sensitive JavaScript syntax checks
        run: |
          node --check frontend/js/chat.js
          node --check frontend/js/terminal.js
          node --check frontend/js/os-workbench-shell.js
          node --check frontend/js/os-platform-runtime.js
      - name: Security regression tests
        run: node --test tests/static-runtime.test.mjs tests/security-hardening.test.mjs
      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
