name: Security Gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'security/**'

permissions:
  contents: read

concurrency:
  group: aizanoi-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4.2.2, pinned to immutable commit SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      # setup-node pinned to an immutable upstream commit.
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: '22'
      - name: Security-sensitive JavaScript syntax checks
        run: |
          node --check frontend/js/chat.js
          node --check frontend/js/terminal.js
          node --check frontend/js/os-workbench-shell.js
          node --check frontend/js/os-platform-runtime.js
      - name: Security regression tests
        run: node --test tests/static-runtime.test.mjs tests/security-hardening.test.mjs
      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
