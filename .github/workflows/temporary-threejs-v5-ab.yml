name: Temporary Three.js V5 A/B

on:
  push:
    branches:
      - exp/threejs-rome-renderer-poc

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: exp/threejs-rome-renderer-poc
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install experiment dependencies
        working-directory: experiments/threejs-rome-renderer
        run: npm install --ignore-scripts --package-lock=false
      - name: Vendor Three.js
        working-directory: experiments/threejs-rome-renderer
        run: npm run vendor
      - name: Install Chromium
        working-directory: experiments/threejs-rome-renderer
        run: npx playwright install chromium --with-deps
      - name: Capture V5 matched baselines
        working-directory: experiments/threejs-rome-renderer
        run: npm run capture:ab
      - name: Upload V5 A/B artifact
        uses: actions/upload-artifact@v4
        with:
          name: rome-renderer-v5-ab
          path: experiments/threejs-rome-renderer/visual-baseline/*.png
          retention-days: 2
      - name: Remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-threejs-v5-ab.yml
          git commit -m 'chore: remove one-shot Rome V5 A/B workflow'
          git push
