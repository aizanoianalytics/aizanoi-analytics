name: Sync Final Polish With Main

on:
  push:
    branches:
      - feat/final-polish-aaa-2026-08-18
    paths:
      - .github/workflows/sync-main-final.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-polish-aaa-2026-08-18
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge current main, preferring main on overlapping conflict hunks
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-ff -X theirs origin/main -m "merge: sync main hardening into final polish"
      - name: Validate merged tree
        run: |
          node --check frontend/js/os-v2.js
          node --check frontend/games/brick.js
          node --check frontend/ancient-cities/rome-410-476/js/app.js
          node --check frontend/ancient-cities/athens-450-430/js/app.js
          node --test tests/*.test.mjs
          git diff HEAD^ --check
      - name: Push synchronized branch
        run: git push origin HEAD:feat/final-polish-aaa-2026-08-18
