name: Final Camera Clearance Gate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/final-camera-clearance-gate.yml
      - scripts/apply-landmark-camera-clearance-2026-08-18.py
      - tests/final-polish.test.mjs
      - tests/os-product-polish.test.mjs

permissions:
  contents: write

jobs:
  final-gate:
    if: github.head_ref == 'feat/final-polish-aaa-2026-08-18'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-polish-aaa-2026-08-18
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply camera-volume clearance patch
        run: python3 scripts/apply-landmark-camera-clearance-2026-08-18.py
      - name: Validate source and regression suite
        run: |
          node --check frontend/ancient-world/engine/landmark-framing.js
          node --check frontend/ancient-cities/rome-410-476/js/app.js
          node --check frontend/ancient-cities/athens-450-430/js/app.js
          node --test tests/*.test.mjs
          git diff --check
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start frontend
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/aizanoi-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/aizanoi-http.log
          exit 1
      - name: Real browser movement smoke
        env:
          ANCIENT_WORLD_BASE_URL: http://127.0.0.1:4173
        run: |
          node tests/ancient-city-browser-smoke.mjs
          node tests/os-browser-smoke.mjs
      - name: Capture final visual review
        env:
          ANCIENT_WORLD_BASE_URL: http://127.0.0.1:4173
        run: node tests/final-visual-capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: final-camera-clearance-review
          path: artifacts/final-visual-review/*.png
          retention-days: 1
      - name: Remove one-shot machinery
        run: |
          rm -f scripts/apply-landmark-camera-clearance-2026-08-18.py
          rm -f scripts/apply-landmark-sightline-fix-2026-08-18.py
          rm -f scripts/fix-landmark-double-resolve-2026-08-18.py
          rm -f tests/final-visual-capture.mjs
          rm -f .github/workflows/final-camera-clearance-gate.yml
      - name: Commit validated final product tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend tests scripts .github/workflows
          git diff --cached --check
          git commit -m "fix: finalize clear and walkable Ancient World landmark views"
          git push origin HEAD:feat/final-polish-aaa-2026-08-18
