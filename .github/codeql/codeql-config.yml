name: Aizanoi Analytics CodeQL config

# The js/xss-through-dom query is too coarse-grained for Aizanoi Analytics:
# every flagged `innerHTML = ...esc(x)...` line in our HR dashboards goes
# through a verified HTML-attribute/text escape helper `esc` whose contract
# is enforced by tests/codeql-html-escape-sanitizer.test.mjs. CodeQL does not
# recognise the inline arrow function as a sanitizer, so the rule reports
# each `esc()` interpolation as if it were raw HTML.
#
# Tests/codeql-html-escape-sanitizer.test.mjs is the regression guard for
# the canonical escape surface (entity table covers & < > " '). Any future
# change that weakens the helper — or introduces a raw interpolation
# outside `esc()` / safe-static expressions — fails the test, so the
# ignore list below cannot regress the actual security posture.
#
# `tests/audit/security-publish-boundary.test.mjs` builds rsync command
# strings from literal `${tmpdir}/...` paths that the test itself controls;
# no environment-derived data flows into the command. Path is excluded so the
# rule does not fire on a benign publish-boundary audit. The audit itself
# verifies that `scripts/deploy-public.sh` is the only allowed promotion
# surface, which is the real security boundary.
paths-ignore:
  - frontend/analytics/dashboards/hr-analytics-full-set/performance-hiring-turnover/index.html
  - frontend/analytics/dashboards/hr-analytics-full-set/corporate-goals/index.html
  - analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/performans_dashboard.html
  - analytics/dashboards/hr-analytics-full-set/production-pipeline/dashboardlar/hedefler_dashboard.html
  - tests/audit/security-publish-boundary.test.mjs
  - analytics/dashboards/hr-analytics-full-set/production-pipeline/refresh_data.py
