<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Control Panel">
  <defs>
    <linearGradient id="azcp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a5a"/>
      <stop offset="100%" stop-color="#1a2a3a"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="4" fill="url(#azcp-bg)" stroke="#0a1a2a" stroke-width="1"/>
  <!-- Panel background -->
  <rect x="6" y="8" width="36" height="32" rx="2" fill="#c8c8d0" stroke="#5a5a6a" stroke-width="1"/>
  <!-- Gear -->
  <g transform="translate(15,20)" fill="#1a5fd6" stroke="#0a2a7a" stroke-width="0.6">
    <circle cx="0" cy="0" r="5"/>
    <rect x="-1.5" y="-9" width="3" height="3"/>
    <rect x="-1.5" y="6" width="3" height="3"/>
    <rect x="-9" y="-1.5" width="3" height="3"/>
    <rect x="6" y="-1.5" width="3" height="3"/>
    <rect x="-7" y="-7" width="3" height="3" transform="rotate(45 -5.5 -5.5)"/>
    <rect x="4" y="-7" width="3" height="3" transform="rotate(45 5.5 -5.5)"/>
    <rect x="-7" y="4" width="3" height="3" transform="rotate(45 -5.5 5.5)"/>
    <rect x="4" y="4" width="3" height="3" transform="rotate(45 5.5 5.5)"/>
    <circle cx="0" cy="0" r="2" fill="#fff"/>
  </g>
  <!-- Toggle switches -->
  <g>
    <rect x="26" y="12" width="14" height="6" rx="1" fill="#5a5a6a" stroke="#1a1a2a" stroke-width="0.5"/>
    <rect x="27" y="13" width="6" height="4" rx="0.5" fill="#1a5fd6"/>
  </g>
  <g>
    <rect x="26" y="22" width="14" height="6" rx="1" fill="#5a5a6a" stroke="#1a1a2a" stroke-width="0.5"/>
    <rect x="33" y="23" width="6" height="4" rx="0.5" fill="#30a030"/>
  </g>
  <g>
    <rect x="26" y="32" width="14" height="6" rx="1" fill="#5a5a6a" stroke="#1a1a2a" stroke-width="0.5"/>
    <rect x="27" y="33" width="6" height="4" rx="0.5" fill="#d0a030"/>
  </g>
</svg>