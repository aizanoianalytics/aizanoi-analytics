<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Recycle Bin">
  <defs>
    <linearGradient id="azrb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6a7a"/>
      <stop offset="100%" stop-color="#2a3a4a"/>
    </linearGradient>
    <linearGradient id="azrb-bin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa8b8"/>
      <stop offset="100%" stop-color="#5a6a7a"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="4" fill="url(#azrb-bg)" stroke="#1a2a3a" stroke-width="1"/>
  <!-- Bin body -->
  <path d="M12 18 L36 18 L34 42 Q34 44 32 44 L16 44 Q14 44 14 42 Z" fill="url(#azrb-bin)" stroke="#3a4a5a" stroke-width="1"/>
  <!-- Vertical lines on bin -->
  <g stroke="#3a4a5a" stroke-width="0.8" opacity="0.6">
    <line x1="18" y1="22" x2="17" y2="40"/>
    <line x1="22" y1="22" x2="22" y2="40"/>
    <line x1="26" y1="22" x2="26" y2="40"/>
    <line x1="30" y1="22" x2="31" y2="40"/>
  </g>
  <!-- Lid -->
  <rect x="9" y="14" width="30" height="4" rx="1" fill="#7a8a9a" stroke="#3a4a5a" stroke-width="0.8"/>
  <!-- Handle on top -->
  <rect x="22" y="10" width="4" height="4" rx="1" fill="none" stroke="#7a8a9a" stroke-width="1.5"/>
  <!-- Aizanoi column above handle (mark) -->
  <rect x="22" y="6" width="1.5" height="4" fill="#d6a75a"/>
  <rect x="24.5" y="6" width="1.5" height="4" fill="#d6a75a"/>
</svg>