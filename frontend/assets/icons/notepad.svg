<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Notepad">
  <defs>
    <linearGradient id="azn-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a5fd6"/>
      <stop offset="100%" stop-color="#0d3fb0"/>
    </linearGradient>
    <linearGradient id="azn-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf3"/>
      <stop offset="100%" stop-color="#f4e6c8"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="4" fill="url(#azn-bg)" stroke="#0a2a7a" stroke-width="1"/>
  <!-- Clipboard backing -->
  <rect x="10" y="8" width="28" height="34" rx="2" fill="#5a6a7a" stroke="#1a2a3a" stroke-width="0.8"/>
  <!-- Paper -->
  <rect x="12" y="12" width="24" height="28" fill="url(#azn-paper)" stroke="#a08a4a" stroke-width="0.6"/>
  <!-- Clip top -->
  <rect x="20" y="6" width="8" height="4" rx="1" fill="#9aa8b8" stroke="#3a4a5a" stroke-width="0.6"/>
  <rect x="22" y="4" width="4" height="3" rx="1" fill="#7a8a9a"/>
  <!-- Pixel lines -->
  <g fill="#5a6a7a">
    <rect x="15" y="18" width="14" height="2"/>
    <rect x="15" y="23" width="18" height="2"/>
    <rect x="15" y="28" width="12" height="2"/>
    <rect x="15" y="33" width="16" height="2"/>
  </g>
</svg>