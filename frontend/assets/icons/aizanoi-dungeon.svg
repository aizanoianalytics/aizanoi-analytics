<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="azBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a3346"/>
      <stop offset="100%" stop-color="#121620"/>
    </radialGradient>
    <linearGradient id="azBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#8d6f34"/>
    </linearGradient>
    <linearGradient id="azMarble" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f4f3ee"/>
      <stop offset="85%" stop-color="#e0ded6"/>
      <stop offset="100%" stop-color="#c4c0b6"/>
    </linearGradient>
    <linearGradient id="azCrack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#b37cd6"/>
      <stop offset="100%" stop-color="#7d3c98"/>
    </linearGradient>
    <filter id="azGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container App Icon Rounded Square -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#azBg)" stroke="url(#azBrass)" stroke-width="2.5"/>

  <!-- Subtle Temple Background Arch -->
  <path d="M 28 108 L 28 50 Q 64 26 100 50 L 100 108" fill="none" stroke="rgba(197, 160, 89, 0.25)" stroke-width="2"/>
  <line x1="20" y1="108" x2="108" y2="108" stroke="rgba(197, 160, 89, 0.4)" stroke-width="2"/>

  <!-- Aizo Pedestal Base -->
  <path d="M 46 92 L 82 92 L 85 106 L 43 106 Z" fill="url(#azMarble)" stroke="#9e9a90" stroke-width="1.5"/>

  <!-- Aizo Marble Head -->
  <!-- Rounded block with broken upper-right corner -->
  <path d="M 38 48 Q 38 34 52 34 L 78 34 L 92 48 L 92 84 Q 92 94 80 94 L 48 94 Q 38 94 38 84 Z" 
        fill="url(#azMarble)" stroke="#9e9a90" stroke-width="2"/>

  <!-- Distinct Chipped/Broken Edge at top right -->
  <path d="M 78 34 L 84 38 L 82 43 L 92 48" fill="none" stroke="#7e7a70" stroke-width="2"/>

  <!-- The Sacred Glowing Zeus Crack -->
  <path d="M 80 37 L 72 50 L 76 56 L 66 69 L 68 76" 
        fill="none" stroke="url(#azCrack)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#azGlow)"/>

  <!-- Obsidian Bead Eyes -->
  <circle cx="52" cy="65" r="5" fill="#121212"/>
  <circle cx="50.5" cy="63.5" r="1.5" fill="#ffffff" opacity="0.9"/>

  <circle cx="80" cy="65" r="5" fill="#121212"/>
  <circle cx="78.5" cy="63.5" r="1.5" fill="#ffffff" opacity="0.9"/>

  <!-- Little Olive Leaf Sprout on Chipped Edge -->
  <path d="M 82 36 Q 90 28 98 32 Q 92 40 82 36 Z" fill="#27ae60" stroke="#1e8449" stroke-width="1"/>
  <path d="M 85 36 Q 88 32 94 33" fill="none" stroke="#1e8449" stroke-width="0.8"/>
</svg>
