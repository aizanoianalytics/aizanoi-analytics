<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Aizanoi TV">
  <defs>
    <linearGradient id="aztv-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a3a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="4" fill="url(#aztv-bg)" stroke="#0a0a1a" stroke-width="1"/>
  <!-- CRT body -->
  <rect x="6" y="8" width="36" height="26" rx="3" fill="#c8d4e0" stroke="#3a4a5a" stroke-width="1"/>
  <!-- Screen inner -->
  <rect x="9" y="11" width="30" height="20" rx="2" fill="#0a3a1a"/>
  <!-- Scanlines -->
  <g stroke="#1a8a3a" stroke-width="0.5" opacity="0.4">
    <line x1="9" y1="15" x2="39" y2="15"/>
    <line x1="9" y1="19" x2="39" y2="19"/>
    <line x1="9" y1="23" x2="39" y2="23"/>
    <line x1="9" y1="27" x2="39" y2="27"/>
  </g>
  <!-- Play triangle -->
  <polygon points="20,16 20,26 30,21" fill="#fff" opacity="0.9"/>
  <!-- CRT base -->
  <rect x="14" y="34" width="20" height="4" fill="#c8d4e0" stroke="#3a4a5a" stroke-width="0.8"/>
  <rect x="18" y="38" width="12" height="3" fill="#9aa8b8"/>
  <!-- Knobs -->
  <circle cx="40" cy="12" r="1.5" fill="#3a4a5a"/>
  <circle cx="40" cy="18" r="1.5" fill="#3a4a5a"/>
</svg>