  <path d="M1155 432C1124 520 1146 589 1110 660s-53 137-23 222 16 142-8 198" fill="none" stroke="#d9edf0" stroke-opacity=".18" stroke-width="2"/>

  <g transform="translate(1330 620) rotate(-5)" opacity=".24" stroke="#e0c995" fill="none">
    <rect x="-164" y="-86" width="328" height="172" rx="3" stroke-width="2"/>
    <rect x="-126" y="-58" width="252" height="116" stroke-width="1.5"/>
    <rect x="-78" y="-38" width="156" height="76" stroke-width="1.2"/>
