    <path d="M0 735C256 673 424 731 655 665s391-84 604-16 391 62 661-12" fill="none" stroke="#c9bd9d" stroke-opacity=".13" stroke-width="1.5"/>
    <path d="M0 785C250 728 449 771 683 714s413-76 603-23 373 56 634 4" fill="none" stroke="#c9bd9d" stroke-opacity=".11" stroke-width="1.2"/>
    <path d="M0 835C263 790 486 827 708 772s396-64 597-22 358 53 615 19" fill="none" stroke="#c9bd9d" stroke-opacity=".09" stroke-width="1"/>
