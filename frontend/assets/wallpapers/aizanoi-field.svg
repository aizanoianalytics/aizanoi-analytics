  <g opacity=".24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e4dcc8">
    <text x="84" y="930" font-size="14" letter-spacing="3">AIZANOI / FIELD GRID 39°12′N 29°37′E</text>
    <text x="84" y="956" font-size="11" letter-spacing="2">ARCHIVE LAYER · PENKALAS · TEMPLE DISTRICT · ANALYTICAL WORKSPACE</text>
