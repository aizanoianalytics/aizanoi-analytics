<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Aizanoi Field System desktop</title>
  <desc id="desc">A restrained archaeological survey inspired landscape with topographic contours, the Penkalas river and abstract temple plan geometry.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111922"/>
      <stop offset="0.52" stop-color="#20313b"/>
      <stop offset="1" stop-color="#6f7769"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="28%" r="58%">
      <stop offset="0" stop-color="#d6b77a" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#9cb7ad" stop-opacity=".07"/>
      <stop offset="1" stop-color="#0b1118" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f735e"/>
      <stop offset="1" stop-color="#29332f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#d8cfb7" stroke-opacity=".055" stroke-width="1"/>
      <path d="M32 0V64M0 32H64" fill="none" stroke="#d8cfb7" stroke-opacity=".025" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

