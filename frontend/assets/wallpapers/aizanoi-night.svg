  <!-- Vignette -->
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.85">
    <stop offset="50%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.3"/>
  </radialGradient>
  <rect width="1920" height="1200" fill="url(#vignette)"/>
