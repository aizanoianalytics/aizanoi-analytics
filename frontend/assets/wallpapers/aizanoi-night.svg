<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="night-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1238"/>
      <stop offset="50%" stop-color="#1a2858"/>
      <stop offset="80%" stop-color="#2a3870"/>
      <stop offset="100%" stop-color="#3a4a78"/>
    </linearGradient>
    <radialGradient id="moon-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fffff0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fffff0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night sky -->
  <rect width="1920" height="1200" fill="url(#night-sky)"/>

  <!-- Moon glow -->
  <circle cx="1620" cy="220" r="180" fill="url(#moon-glow)"/>
  <!-- Moon -->
  <circle cx="1620" cy="220" r="44" fill="#f4f0d8"/>
  <circle cx="1610" cy="210" r="10" fill="#d8d4b8" opacity="0.45"/>
  <circle cx="1632" cy="232" r="6" fill="#d8d4b8" opacity="0.45"/>

  <!-- Pixel stars (small blocks) -->
  <g fill="#fff8d8">
    <rect x="120" y="80" width="3" height="3"/>
    <rect x="280" y="160" width="2" height="2"/>
    <rect x="440" y="100" width="3" height="3"/>
    <rect x="600" y="220" width="2" height="2"/>
    <rect x="780" y="60" width="3" height="3"/>
    <rect x="940" y="180" width="2" height="2"/>
    <rect x="1100" y="120" width="3" height="3"/>
    <rect x="1260" y="200" width="2" height="2"/>
    <rect x="1400" y="80" width="3" height="3"/>
    <rect x="1740" y="160" width="2" height="2"/>
    <rect x="1840" y="100" width="3" height="3"/>
    <rect x="200" y="260" width="2" height="2"/>
    <rect x="360" y="340" width="2" height="2"/>
    <rect x="520" y="380" width="2" height="2"/>
    <rect x="700" y="320" width="2" height="2"/>
    <rect x="880" y="280" width="2" height="2"/>
    <rect x="1060" y="380" width="2" height="2"/>
    <rect x="1220" y="320" width="2" height="2"/>
    <rect x="1380" y="280" width="2" height="2"/>
    <rect x="1540" y="380" width="2" height="2"/>
    <rect x="1700" y="320" width="2" height="2"/>
  </g>

  <!-- Distant hill silhouette -->
  <path d="M0 880 Q480 820 960 860 T1920 840 L1920 1200 L0 1200 Z" fill="#1a2a48" opacity="0.85"/>
  <path d="M0 940 Q420 900 940 930 T1920 920 L1920 1200 L0 1200 Z" fill="#0a1a38"/>

  <!-- Foreground hill -->
  <path d="M0 1020 Q420 970 940 1000 T1920 980 L1920 1200 L0 1200 Z" fill="#050a20"/>

  <!-- Mid-ground temple silhouette (faded) -->
  <g transform="translate(820,780)" opacity="0.5">
    <rect x="-220" y="60" width="440" height="44" fill="#3a4a68"/>
    <polygon points="-220,60 0,-44 220,60" fill="#3a4a68"/>
    <rect x="-200" y="60" width="6" height="110" fill="#2a3a58"/>
    <rect x="-150" y="60" width="6" height="110" fill="#2a3a58"/>
    <rect x="-100" y="60" width="6" height="110" fill="#2a3a58"/>
    <rect x="-50" y="60" width="6" height="110" fill="#2a3a58"/>
    <rect x="0" y="60" width="6" height="110" fill="#2a3a58"/>
    <rect x="50" y="60" width="6" height="110" fill="#2a3a58"/>
    <rect x="100" y="60" width="6" height="110" fill="#2a3a58"/>
    <rect x="150" y="60" width="6" height="110" fill="#2a3a58"/>
    <rect x="200" y="60" width="6" height="110" fill="#2a3a58"/>
  </g>

  <!-- Foreground small temple (left) -->
  <g transform="translate(180,920)" opacity="0.78">
    <rect x="-70" y="0" width="140" height="14" fill="#2a3a58"/>
    <polygon points="-70,0 0,-50 70,0" fill="#2a3a58"/>
    <rect x="-58" y="0" width="4" height="36" fill="#1a2848"/>
    <rect x="-40" y="0" width="4" height="36" fill="#1a2848"/>
    <rect x="-22" y="0" width="4" height="36" fill="#1a2848"/>
    <rect x="-4" y="0" width="4" height="36" fill="#1a2848"/>
    <rect x="14" y="0" width="4" height="36" fill="#1a2848"/>
    <rect x="32" y="0" width="4" height="36" fill="#1a2848"/>
    <rect x="50" y="0" width="4" height="36" fill="#1a2848"/>
  </g>

  <!-- Foreground small temple (right) -->
  <g transform="translate(1740,930)" opacity="0.72">
    <rect x="-60" y="0" width="120" height="12" fill="#2a3a58"/>
    <polygon points="-60,0 0,-44 60,0" fill="#2a3a58"/>
    <rect x="-50" y="0" width="3" height="30" fill="#1a2848"/>
    <rect x="-32" y="0" width="3" height="30" fill="#1a2848"/>
    <rect x="-14" y="0" width="3" height="30" fill="#1a2848"/>
    <rect x="4" y="0" width="3" height="30" fill="#1a2848"/>
    <rect x="22" y="0" width="3" height="30" fill="#1a2848"/>
    <rect x="40" y="0" width="3" height="30" fill="#1a2848"/>
