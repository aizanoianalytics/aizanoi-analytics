<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" role="img" aria-label="Aizanoi Analytics">
  <defs>
    <linearGradient id="az-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a5fd6"/>
      <stop offset="100%" stop-color="#0d3fb0"/>
    </linearGradient>
    <linearGradient id="az-warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6a75a"/>
      <stop offset="100%" stop-color="#a07a3a"/>
    </linearGradient>
  </defs>

  <!-- Mark: temple silhouette + data dots -->
  <g transform="translate(8,8)">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="url(#az-bg)"/>
    <!-- temple base -->
    <rect x="8" y="34" width="32" height="8" fill="#d6a75a" opacity="0.85"/>
    <!-- columns -->
    <rect x="11" y="20" width="3" height="14" fill="#d6a75a"/>
    <rect x="18" y="20" width="3" height="14" fill="#d6a75a"/>
    <rect x="25" y="20" width="3" height="14" fill="#d6a75a"/>
    <rect x="32" y="20" width="3" height="14" fill="#d6a75a"/>
    <!-- pediment triangle -->
    <polygon points="8,20 24,8 40,20" fill="#d6a75a"/>
    <!-- pixel data dots above pediment -->
    <circle cx="14" cy="6" r="1.5" fill="#9bc4ff"/>
    <circle cx="24" cy="3" r="1.5" fill="#9bc4ff"/>
    <circle cx="34" cy="6" r="1.5" fill="#9bc4ff"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(68,0)" font-family="'Trebuchet MS', Tahoma, sans-serif">
    <text x="0" y="30" font-size="22" font-weight="700" fill="#0d3fb0" letter-spacing="0.5">Aizanoi</text>
    <text x="0" y="50" font-size="14" font-weight="400" fill="#444" letter-spacing="2">ANALYTICS</text>
  </g>
</svg>