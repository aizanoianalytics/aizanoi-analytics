<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="440" height="100" role="img" aria-label="Aizanoi Analytics">
  <defs>
    <!-- Background squircle -->
    <linearGradient id="hSqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1d24"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </linearGradient>
    <linearGradient id="hCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7bf7ee"/>
      <stop offset="100%" stop-color="#1497b8"/>
    </linearGradient>
    <linearGradient id="hBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2d6"/>
      <stop offset="100%" stop-color="#b28038"/>
    </linearGradient>
  </defs>

  <!-- Mark Container (74x74) -->
  <g transform="translate(14, 13)">
    <rect width="74" height="74" rx="18" fill="url(#hSqBg)"/>
    <rect x="0.5" y="0.5" width="73" height="73" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

    <!-- Orb Core -->
    <circle cx="37" cy="37" r="23" fill="#0c1d33"/>

    <!-- Swirls -->
    <path d="M 37 17 C 49 17 56 24 56 37 C 56 47 47 54 37 54 C 28 54 23 47 23 40 C 23 34 30 30 36 30"
          fill="none" stroke="url(#hCyan)" stroke-width="4.2" stroke-linecap="round" opacity="0.95"/>
    <path d="M 37 57 C 25 57 18 50 18 37 C 18 27 27 20 37 20 C 46 20 51 27 51 34 C 51 40 44 44 38 44"
          fill="none" stroke="url(#hBronze)" stroke-width="4.2" stroke-linecap="round" opacity="0.95"/>

    <circle cx="37" cy="37" r="3" fill="#ffffff"/>
    <circle cx="37" cy="37" r="23" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
    <path d="M 22 28 A 23 23 0 0 1 52 28 A 20 16 0 0 0 22 28 Z" fill="#ffffff" opacity="0.22"/>
  </g>

  <!-- Typography -->
  <g transform="translate(108, 16)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Brand Name -->
    <text x="0" y="38" font-size="34" font-weight="800" fill="#141c2b" letter-spacing="-0.035em">
      Aizanoi
    </text>

    <!-- Subtitle descriptor -->
    <text x="1" y="60" font-size="11" font-weight="700" fill="#a47735" letter-spacing="0.26em">
      ANALYTICS
    </text>

    <!-- OS Pill Badge -->
    <g transform="translate(138, 18)">
      <rect x="0" y="0" width="36" height="20" rx="6" fill="#12151c"/>
      <text x="18" y="14" font-size="10" font-weight="750" fill="#00ddff" text-anchor="middle" letter-spacing="0.05em">OS</text>
    </g>
  </g>
</svg>
